<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Handwriting Studio</title>

<style>
:root{--a:#a855f7}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#090510;color:#eee;font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

#auth{
 position:fixed;inset:0;display:grid;place-items:center;
 background:radial-gradient(circle at center,#24103b,#090510 65%)
}
#auth .authBox{
 display:flex;flex-direction:column;align-items:center;gap:10px
}
#pass{
 width:250px;padding:13px 16px;border:1px solid #5b2b78;
 border-radius:12px;background:#160c20;color:white;outline:0;
 text-align:center;box-sizing:border-box
}
#loginBtn{
 width:250px;padding:11px 16px;border:1px solid #5b2b78;
 border-radius:10px;background:#1d0d29;color:white
}
#loginBtn:hover{border-color:var(--a);background:#241033}
.adminHint{
 margin-top:2px;color:#8d7b99;font-size:12px;text-align:center
}
.adminHint b{color:#b99acb;font-weight:600}
#pass:focus{border-color:var(--a);box-shadow:0 0 20px #a855f733}

#app{display:none;width:100%;height:100vh;padding:10px;overflow:hidden}

.top{
 width:100%;height:42px;display:flex;align-items:center;gap:7px
}
.tab,.gear{
 border:1px solid #392049;background:#160d20;color:#bbb;
 border-radius:9px;padding:7px 14px
}
.tab.active,.tab:hover,.gear:hover{border-color:var(--a);color:white}
.gear{margin-left:auto;font-size:17px}

.page{
 width:100%;height:calc(100vh - 62px);
 background:#100818;border:1px solid #2d193a;
 border-radius:14px;padding:10px
}

#generate{display:flex;gap:10px;overflow:hidden}

.side{
 width:200px;min-width:200px;height:100%;
 background:#140b1c;border:1px solid #2c1938;
 border-radius:11px;padding:10px;overflow:hidden
}
.side label{
 display:block;font-size:11px;color:#999;margin:7px 0 4px
}
.side input,.side textarea,.side select{
 width:100%;background:#0c0711;color:white;
 border:1px solid #382044;border-radius:7px;padding:7px;outline:0
}
.side textarea{height:75px;resize:none}
.side input:focus,.side textarea:focus,.side select:focus{border-color:var(--a)}
.side button{
 width:100%;margin-top:6px;padding:7px;border-radius:7px;
 border:1px solid #452453;background:#1b0d27;color:#ddd;font-size:12px
}
.side button:hover{border-color:var(--a)}

.sheetWrap{
 flex:1;min-width:0;min-height:0;display:flex;
 justify-content:center;align-items:center;overflow:hidden
}
.sheet{
 height:min(100%,calc((100vw - 250px)*1.414));
 width:auto;aspect-ratio:210/297;max-width:100%;
 background:white;box-shadow:0 8px 40px #000b;overflow:hidden
}
#genCanvas{display:block;width:100%;height:100%}

#studio{
 display:none;flex-direction:column;align-items:center;
 justify-content:center;gap:8px;overflow:hidden
}

.studioHead{
 width:min(820px,100%);display:flex;align-items:center;
 justify-content:space-between;gap:8px;flex:none
}
.counter{color:#aaa;font-size:12px;white-space:nowrap}

.studioBtns{
 display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end
}
.studioBtns button{
 background:#160c20;border:1px solid #382044;color:#ddd;
 padding:7px 9px;border-radius:7px;font-size:12px
}
.studioBtns button:hover{border-color:var(--a)}
.studioBtns button:disabled{opacity:.35;cursor:not-allowed}

.drawWrap{
 width:min(720px,100%);max-height:calc(100% - 50px);
 background:#160d1e;border:1px solid #33203f;
 border-radius:11px;padding:8px;overflow:hidden
}
#drawCanvas{
 display:block;width:100%;height:auto;max-height:100%;
 background:white;border-radius:6px;touch-action:none;cursor:crosshair
}

.settings{
 display:none;position:fixed;inset:0;background:#0009;
 align-items:center;justify-content:center;z-index:10
}
.settingsBox{
 width:280px;background:#130a1b;border:1px solid #472454;
 border-radius:13px;padding:16px;box-shadow:0 15px 60px #000
}
.settingsTop{display:flex;justify-content:space-between;align-items:center}
.close{border:0;background:none;color:#aaa;font-size:23px;cursor:pointer}
.close:hover{color:white}
.settings label{display:block;color:#aaa;font-size:12px;margin-top:16px}
.settings input{width:100%;margin-top:6px}

@media(max-height:700px){
 #app{padding:7px}
 .top{height:36px}
 .page{height:calc(100vh - 50px);padding:7px}
 .side{width:180px;min-width:180px;padding:8px}
 .side label{margin:4px 0 2px;font-size:10px}
 .side input,.side textarea,.side select{padding:5px}
 .side textarea{height:55px}
 .side button{padding:5px;margin-top:4px;font-size:11px}
 .tab,.gear{padding:5px 11px}
 .studioBtns button{padding:5px 8px;font-size:11px}
}

@media(max-width:600px){
 #generate{flex-direction:column}
 .side{
  width:100%;min-width:0;height:auto;display:grid;
  grid-template-columns:repeat(2,1fr);gap:5px;overflow:hidden
 }
 .side label{margin:2px 0}
 .side textarea{height:42px}
 .side button{margin:0}
 .sheetWrap{min-height:0}
 .sheet{height:100%;max-height:100%}
 .studioHead{flex-direction:column;align-items:center}
 .studioBtns{justify-content:center}
}

@media(max-height:550px){
 .side{grid-template-columns:repeat(3,1fr)}
}

.adminDetails{

@media(max-width:600px){

<script>

 apiKey:"AIzaSyBVAM3wehDn1lUl_FIs-OdZMK5hx6CF_Aw",
 authDomain:"aschapha228.firebaseapp.com",

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});

// ================= ACCESS CODES =================
// EDIT ONLY the 20 values below.
// 1 code = 1 successful use.
// If you replace a USED slot with a different code, that slot becomes usable again.
// Keep all 20 codes UNIQUE.
const ACCESS_CODES=[
 "252612","17261","2717","0112",
 "4713","19371","10987","000012","00023",
 "0017317","0283","0183","038136","0272736",
 "0273","75500","0270","122236","162018","0000"
];

const ADMIN_CODE="3ed43ef3";
const SESSION_KEY="hs_firebase_session";
const ACCESS_KEY="hs_firebase_access";
const ADMIN_KEY="hs_firebase_admin";

let firebaseUid=localStorage.getItem(SESSION_KEY);
let firebaseAccessCode=localStorage.getItem(ACCESS_KEY)||"";
let firebaseIsAdmin=localStorage.getItem(ADMIN_KEY)==="true";

// Clear legacy saved sessions from older versions.
if(firebaseAccessCode.startsWith("master-")){
 localStorage.removeItem(ACCESS_KEY);
 firebaseAccessCode="";
}

if(!firebaseUid){
 firebaseUid="hs_"+Math.random().toString(36).slice(2,12);
 localStorage.setItem(SESSION_KEY,firebaseUid);
}

const $=id=>document.getElementById(id);

function openStudioApp(){
 $("auth").style.display="none";
 $("app").style.display="block";
 try{
  updateFontList();
  loadGlyph();
  render();
 }catch(err){
  console.error("Studio init error:",err);
 }
}

const chars=[
 ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ",
 ..."abcdefghijklmnopqrstuvwxyz",
 ..."ÄÖÜäöüß",
 ..."0123456789",
 ...`.,!?;:'"-–—_()[]{}/\\@#$%&*+=<>€£¥©®™°§…«»„“”’`
];


/* FONT DATA */

let fonts=JSON.parse(
 localStorage.getItem("hs_fonts")||"null"
)||{"My Font":{glyphs:{}}};

let currentFont=
 localStorage.getItem("hs_current")
 ||Object.keys(fonts)[0];

let charIndex=0;
let variationIndex=0;

let strokes=[];
let drawing=false;
let activeStroke=null;


/* AUTH */

function showAuthError(message){
 let el=$("authError");
 if(!el){
  el=document.createElement("div");
  el.id="authError";
  el.style.cssText="margin-top:10px;text-align:center;color:#ff6b6b;font-size:13px;min-height:18px;";
  $("loginBtn").insertAdjacentElement("afterend",el);
 }
 el.textContent=message||"";
}

function clearAuthError(){
 const el=$("authError");
 if(el)el.textContent="";
}

function escapeHtml(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

async function registerFirebaseUser(type){
 const uid=firebaseUid;
 const code=firebaseAccessCode||type;
 const ua=navigator.userAgent||"";
 let device="Desktop";
 if(/iPad|Tablet/i.test(ua))device="Tablet";
 else if(/Mobile|Android|iPhone/i.test(ua))device="Mobile";

 const user={
  uid,
  code,
  type,
  device,
  browser:/Edg\//.test(ua)?"Edge":/Chrome\//.test(ua)?"Chrome":/Safari\//.test(ua)?"Safari":/Firefox\//.test(ua)?"Firefox":"Other",
  language:navigator.language||"",
  timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"",
  screen:(screen.width||0)+"x"+(screen.height||0),
  pixelRatio:window.devicePixelRatio||1,
  touchPoints:navigator.maxTouchPoints||0,
  platform:navigator.platform||"",
  userAgent:ua,
  lastSeen:Date.now(),
  online:true
 };

 const existing=await db.ref("users/"+uid).once("value");
 if(!existing.exists())user.joinedAt=Date.now();
 await db.ref("users/"+uid).update(user);
 await db.ref("presence/"+uid).set({
  code,
  online:true,
  lastSeen:Date.now()
 });

 // Mark offline when this tab/browser closes.
 db.ref("presence/"+uid).onDisconnect().set({
  code,
  online:false,
  lastSeen:Date.now()
 });
}

async function checkBanAndRedirect(){
 try{
  const snap=await db.ref("bans/"+firebaseUid).once("value");
  if(snap.exists()){
   window.location.href="https://www.google.com/";
   return true;
  }
 }catch(e){}
 return false;
}

async function authenticateAccess(){
 clearAuthError();

 const input=$("pass");
 const value=input.value.trim();

 if(!value){
  showAuthError("Enter a code.");
  return;
 }

 if(!firebase.auth().currentUser){
  try{
   await firebase.auth().signInAnonymously();
  }catch(err){
   console.error("Anonymous auth:",err);
   showAuthError("Firebase login failed. Enable Anonymous Authentication.");
   return;
  }
 }

 firebaseUid=firebase.auth().currentUser.uid;
 localStorage.setItem(SESSION_KEY,firebaseUid);

 if(await checkBanAndRedirect())return;

 // Admin code gets its own fresh claim path so an old test does not
 // accidentally disable the current admin login.
 if(value===ADMIN_CODE){
  try{
   const claim=await db.ref("admin/claimed_v3").transaction(current=>{
    if(current===true)return;
    return true;
   });

   if(!claim.committed || claim.snapshot.val()!==true){
    showAuthError("Admin code already used.");
    return;
   }

   await db.ref("admin/owner").set({
    uid:firebaseUid,
    claimedAt:Date.now()
   });

   firebaseIsAdmin=true;
   firebaseAccessCode="ADMIN";
   localStorage.setItem(ADMIN_KEY,"true");
   localStorage.setItem(ACCESS_KEY,"ADMIN");

   await registerFirebaseUser("Admin");
   openStudioApp();
   $("pass").value="";
   return;
  }catch(err){
   console.error("Admin login:",err);
   showAuthError("Firebase error: "+(err.message||"check Firebase Rules."));
   return;
  }
 }

 const normalized=value.toUpperCase();

 // Find the slot whose CURRENT HTML code matches.
 let matchedSlot=-1;
 for(let i=0;i<ACCESS_CODES.length;i++){
  if(String(ACCESS_CODES[i]).toUpperCase()===normalized){
   matchedSlot=i;
   break;
  }
 }

 if(matchedSlot===-1){
  showAuthError("Invalid code.");
  return;
 }

 try{
  const ref=db.ref("accessSlots/"+matchedSlot);

  const result=await ref.transaction(slot=>{
   // First use of this slot.
   if(!slot){
    return {
     code:normalized,
     used:true,
     usedBy:firebaseUid,
     usedAt:Date.now(),
     createdAt:Date.now()
    };
   }

   // The code in HTML changed -> this is a NEW code for this slot.
   // It gets one fresh use immediately.
   if(String(slot.code||"").toUpperCase()!==normalized){
    return {
     code:normalized,
     used:true,
     usedBy:firebaseUid,
     usedAt:Date.now(),
     replacedAt:Date.now()
    };
   }

   // Same code was already used.
   if(slot.used===true)return;

   return {
    ...slot,
    code:normalized,
    used:true,
    usedBy:firebaseUid,
    usedAt:Date.now()
   };
  });

  const data=result.snapshot.val();

  if(result.committed && data &&
     data.used===true &&
     data.usedBy===firebaseUid &&
     String(data.code).toUpperCase()===normalized){

   firebaseAccessCode=normalized;
   firebaseIsAdmin=false;
   localStorage.setItem(ACCESS_KEY,normalized);
   localStorage.removeItem(ADMIN_KEY);

   await registerFirebaseUser("One-time code");
   openStudioApp();
   $("pass").value="";
   return;
  }

  showAuthError("This code was already used.");
 }catch(err){
  console.error("Code login:",err);
  showAuthError("Firebase error: "+(err.message||"check Firebase Rules."));
 }
}

async function refreshAdminUsers(){
 if(!firebaseIsAdmin)return;

 const list=$("adminUsers");
 list.innerHTML='<div style="color:#777;font-size:12px">Loading...</div>';

 try{
  const snap=await db.ref("users").once("value");
  const users=snap.val()||{};
  const ids=Object.keys(users);

  list.innerHTML="";

  if(!ids.length){
   list.innerHTML='<div style="color:#777;font-size:12px">No users yet.</div>';
   return;
  }

  ids.sort((a,b)=>(users[b].lastSeen||0)-(users[a].lastSeen||0));

  for(const uid of ids){
   const u=users[uid]||{};
   const onlineSnap=await db.ref("presence/"+uid).once("value");
   const online=onlineSnap.val()?.online===true;

   const row=document.createElement("div");
   row.className="adminUser";
   row.innerHTML=`
    <div class="adminUserInfo">
     <div class="adminUserCode">${escapeHtml(u.code||uid)}</div>
     <div class="adminUserMeta">
      <span style="color:${online?"#65e572":"#888"}">${online?"● Online":"● Offline"}</span>
      · ${escapeHtml(u.device||"Unknown")}
     </div>
    </div>
    <div class="adminUserBtns">
     <button class="moreBtn">More</button>
     <button class="kickBtn">Kick</button>
     <button class="banBtn">Ban</button>
    </div>
   `;

   row.querySelector(".moreBtn").onclick=()=>showUserDetails(uid);
   row.querySelector(".kickBtn").onclick=()=>adminKick(uid);
   row.querySelector(".banBtn").onclick=()=>adminBan(uid);

   list.appendChild(row);
  }
 }catch(err){
  console.error(err);
  list.innerHTML='<div style="color:#ff6b6b;font-size:12px">Could not load users.</div>';
 }
}

async function showUserDetails(uid){
 if(!firebaseIsAdmin)return;
 const snap=await db.ref("users/"+uid).once("value");
 const u=snap.val()||{};
 $("adminDetails").innerHTML=`
  <b>Code:</b> ${escapeHtml(u.code||"—")}<br>
  <b>Device:</b> ${escapeHtml(u.device||"—")}<br>
  <b>Browser:</b> ${escapeHtml(u.browser||"—")}<br>
  <b>Language:</b> ${escapeHtml(u.language||"—")}<br>
  <b>Timezone:</b> ${escapeHtml(u.timezone||"—")}<br>
  <b>Screen:</b> ${escapeHtml(u.screen||"—")}<br>
  <b>Platform:</b> ${escapeHtml(u.platform||"—")}<br>

/* DRAWING */

const dc=$("drawCanvas");
const ctx=dc.getContext("2d");


function resizeDraw(){

 let r=dc.getBoundingClientRect();

 if(!r.width)return;

 let width=r.width;
 let height=width*.5833;
 let dpr=Math.max(1,window.devicePixelRatio||1);

 dc.width=Math.round(width*dpr);
 dc.height=Math.round(height*dpr);

 ctx.setTransform(dpr,0,0,dpr,0,0);

 drawStudio();
}


function pos(e){

 let r=dc.getBoundingClientRect();

 return{
  x:(e.clientX-r.left)*
   (dc.clientWidth/r.width),

  y:(e.clientY-r.top)*
   (dc.clientHeight/r.height)
 };
}


dc.addEventListener("pointerdown",e=>{

 e.preventDefault();
 drawing=true;

 try{dc.setPointerCapture(e.pointerId)}catch{}

 activeStroke=[pos(e)];
 strokes.push(activeStroke);

 drawStudio();
});


dc.addEventListener("pointermove",e=>{

 if(!drawing)return;

 e.preventDefault();

 activeStroke.push(pos(e));

 drawStudio();
});


function endDraw(e){

 drawing=false;
 activeStroke=null;

 try{dc.releasePointerCapture(e.pointerId)}catch{}
}

dc.addEventListener("pointerup",endDraw);
dc.addEventListener("pointercancel",endDraw);


/* DRAW */

function line(points,color,width){

 if(!points.length)return;

 ctx.beginPath();

 ctx.lineCap="round";
 ctx.lineJoin="round";

 ctx.strokeStyle=color;
 ctx.lineWidth=width;

 ctx.moveTo(points[0].x,points[0].y);

 for(let i=1;i<points.length;i++)
  ctx.lineTo(points[i].x,points[i].y);

 if(points.length===1)
  ctx.lineTo(
   points[0].x+.1,
   points[0].y+.1
  );

 ctx.stroke();
}


function guideChar(){

 let ch=chars[charIndex];
 let w=dc.clientWidth;
 let h=dc.clientHeight;

 ctx.save();

 ctx.font=`${Math.min(w,h)*.42}px Arial`;
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillStyle="rgba(120,120,120,.22)";

 ctx.fillText(ch,w/2,h*.51);

 ctx.restore();
}


function drawStudio(){

 let w=dc.clientWidth;
 let h=dc.clientHeight;

 if(!w)return;

 ctx.clearRect(0,0,w,h);

 ctx.fillStyle="#fff";
 ctx.fillRect(0,0,w,h);

 ctx.lineWidth=2;
 ctx.strokeStyle="rgba(220,40,40,.35)";

 [.22,.42,.62,.82].forEach(y=>{

  ctx.beginPath();
  ctx.moveTo(0,h*y);
  ctx.lineTo(w,h*y);
  ctx.stroke();
 });

 guideChar();

 for(const s of strokes)
  line(s,"#111",Math.max(3,w/170));
}


/* CHARACTER DATA */

function ensureCharacter(ch){

 let g=fonts[currentFont].glyphs[ch];

 if(!g){

  g={
   variations:[{strokes:[]}]
  };

  fonts[currentFont].glyphs[ch]=g;

 }else if(!Array.isArray(g.variations)){

  g={
   variations:[
    {strokes:g.strokes||[]}
   ]
  };

  fonts[currentFont].glyphs[ch]=g;
 }

 if(!g.variations.length)
  g.variations.push({strokes:[]});

 return g;
}


/* COUNTER */

function updateCounter(){

 let ch=chars[charIndex];
 let g=ensureCharacter(ch);

 let total=g.variations.length;

 $("counter").textContent=
  `${charIndex+1}/${chars.length} • "${ch}" • Variation ${variationIndex+1}/${total}`;

 $("variationBack").disabled=
  variationIndex===0;

 $("variationNext").disabled=
  variationIndex>=total-1;

 $("deleteVariation").disabled=
  total<=1;

 $("charBack").disabled=
  charIndex===0;

 $("charNext").disabled=
  charIndex===chars.length-1;
}


/* SAVE */

function saveGlyph(){

 let ch=chars[charIndex];
 let g=ensureCharacter(ch);

 g.variations[variationIndex]={
  strokes:JSON.parse(
   JSON.stringify(strokes)
  )
 };

 saveFonts();
 updateCounter();
 render();
}


/* LOAD */

function loadGlyph(){

 let ch=chars[charIndex];
 let g=ensureCharacter(ch);

 if(variationIndex>=g.variations.length)
  variationIndex=g.variations.length-1;

 let v=g.variations[variationIndex];

 strokes=v?.strokes
  ?JSON.parse(JSON.stringify(v.strokes))
  :[];

 updateCounter();
 drawStudio();
}

/* GENERATOR */

const gc=$("genCanvas");
const gx=gc.getContext("2d");


function resizeGenerate(){

 let r=gc.getBoundingClientRect();

 if(!r.width||!r.height)return;

 let dpr=2;

 gc.width=Math.round(r.width*dpr);
 gc.height=Math.round(r.height*dpr);

 gx.setTransform(dpr,0,0,dpr,0,0);
}


function drawGlyph(g,x,y,size,color){

 if(!g?.strokes?.length)return 0;

 let sx=size/100;

 let minX=Infinity;
 let minY=Infinity;
 let maxX=-Infinity;
 let maxY=-Infinity;

 g.strokes.forEach(s=>
  s.forEach(p=>{

   minX=Math.min(minX,p.x);
   minY=Math.min(minY,p.y);
   maxX=Math.max(maxX,p.x);
   maxY=Math.max(maxY,p.y);

  })
 );

 if(!isFinite(minX))return 0;

 gx.save();

 gx.translate(
  x-minX*sx,
  y-minY*sx
 );

 gx.scale(sx,sx);

 g.strokes.forEach(s=>{

  gx.beginPath();

  gx.strokeStyle=color;
  gx.lineWidth=
   Math.max(2,(g.width||1200)/170);

  gx.lineCap="round";
  gx.lineJoin="round";

  s.forEach((p,i)=>{

   if(i)gx.lineTo(p.x,p.y);
   else gx.moveTo(p.x,p.y);

  });

  gx.stroke();
 });

 gx.restore();

 return(maxX-minX)*sx;
}


/* RANDOM VARIATION */

function randomGlyph(ch){

 let g=fonts[currentFont].glyphs[ch];

 if(!g)return null;

 if(Array.isArray(g.variations)){

  let usable=
   g.variations.filter(
    v=>v?.strokes?.length
   );

  if(usable.length){

   return usable[
    Math.floor(
     Math.random()*usable.length
    )
   ];
  }
 }

 if(g.strokes?.length)
  return g;

 return null;
}


/* RENDER */

function render(){

 let w=gc.clientWidth;
 let h=gc.clientHeight;

 if(!w||!h)return;

 gx.clearRect(0,0,w,h);

 gx.fillStyle=$("paperColor").value;
 gx.fillRect(0,0,w,h);

 let size=+$("fontSize").value||32;
 let letter=+$("letterSpace").value||0;
 let lineGap=+$("lineSpace").value||0;

 let text=$("text").value;
 let color=$("textColor").value;

 let left=35;
 let top=45;
 let maxW=w-70;
 let lineHeight=size+lineGap;
 let y=top;

 for(let row of text.split("\n")){

  let x=left;

  for(let ch of row){

   let g=randomGlyph(ch);

   if(g){

    let advance=
     drawGlyph(
      g,x,y,size,color
     );

    x+=advance+letter;

   }else{

    gx.save();

    gx.font=`${size}px Arial`;
    gx.fillStyle=color;
    gx.textBaseline="top";

    gx.fillText(ch,x,y);

    x+=
     gx.measureText(ch).width
     +letter;

    gx.restore();
   }

   if(x>maxW){

    x=left;
    y+=lineHeight;
   }
  }

  y+=lineHeight;
 }
}
