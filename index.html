<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Font Studio</title>

<style>
:root{
  --accent:#a855f7;
  --accent2:#c084fc;
  --bg:#07040d;
  --panel:rgba(18,10,30,.88);
  --panel2:rgba(30,15,48,.92);
  --text:#fff;
  --muted:#c084fc;
  --border:rgba(168,85,247,.55);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top,#25083e 0%,#07040d 65%);
  color:var(--text);
  font-family:Segoe UI,system-ui,sans-serif;
  overflow:hidden;
}

/* ================= PASSWORD ================= */

#auth{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#07040d;
}

#auth input{
  width:min(340px,85vw);
  padding:16px 20px;
  border-radius:14px;
  border:1px solid var(--border);
  outline:none;
  background:#09060e;
  color:white;
  text-align:center;
  font-size:18px;
  box-shadow:0 0 25px rgba(168,85,247,.15);
}

#auth input:focus{
  border-color:var(--accent2);
  box-shadow:0 0 25px rgba(168,85,247,.4);
}

/* ================= APP ================= */

#app{
  display:none;
  height:100vh;
}

.topbar{
  height:68px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid var(--border);
  background:rgba(10,5,17,.8);
  backdrop-filter:blur(18px);
}

.tabs{
  display:flex;
  gap:6px;
  padding:5px;
  border:1px solid var(--border);
  border-radius:13px;
  background:rgba(0,0,0,.35);
}

.tab{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:10px 30px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
  transition:.2s;
}

.tab.active{
  color:white;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 0 18px rgba(168,85,247,.35);
}

/* ================= SETTINGS ================= */

.settings-button{
  position:fixed;
  left:20px;
  top:15px;
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--panel);
  color:white;
  cursor:pointer;
  font-size:18px;
}

.settings-panel{
  position:fixed;
  top:0;
  left:-310px;
  width:290px;
  height:100vh;
  z-index:5000;
  padding:25px;
  background:rgba(12,6,20,.97);
  border-right:1px solid var(--border);
  box-shadow:10px 0 40px rgba(0,0,0,.35);
  transition:.3s;
  overflow:auto;
}

.settings-panel.open{
  left:0;
}

.settings-panel h2{
  margin-bottom:25px;
}

.setting{
  margin-bottom:20px;
}

.setting label{
  display:block;
  margin-bottom:8px;
  color:var(--muted);
  font-size:13px;
}

.setting input,
.setting select{
  width:100%;
  padding:11px;
  border-radius:9px;
  border:1px solid var(--border);
  background:#08050d;
  color:white;
  outline:none;
}

.color-input{
  height:44px!important;
  padding:3px!important;
}

/* ================= GENERATE ================= */

#generate{
  height:calc(100vh - 68px);
  display:flex;
}

.generate-sidebar{
  width:280px;
  min-width:280px;
  height:100%;
  padding:22px;
  background:rgba(11,6,18,.78);
  border-right:1px solid var(--border);
  overflow:auto;
}

.generate-sidebar h3{
  margin-bottom:18px;
}

.control{
  margin-bottom:18px;
}

.control label{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:13px;
  margin-bottom:7px;
}

.control select,
.control input[type="number"]{
  width:100%;
  padding:10px;
  border-radius:9px;
  border:1px solid var(--border);
  background:#08050d;
  color:white;
}

.control input[type="range"]{
  width:100%;
  accent-color:var(--accent);
}

.background-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.bg-btn{
  height:38px;
  border:1px solid var(--border);
  border-radius:8px;
  cursor:pointer;
}

.export-buttons{
  display:grid;
  gap:8px;
  margin-top:25px;
}

.export-btn{
  border:0;
  border-radius:9px;
  padding:12px;
  color:white;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  cursor:pointer;
  font-weight:700;
}

.delete-font{
  margin-top:8px;
  width:100%;
  padding:9px;
  border-radius:8px;
  border:1px solid #ef4444;
  background:transparent;
  color:#ff7777;
  cursor:pointer;
}

.rename-font{
  margin-top:8px;
  width:100%;
  padding:9px;
  border-radius:8px;
  border:1px solid var(--border);
  background:transparent;
  color:white;
  cursor:pointer;
}

/* ================= PAPER ================= */

.paper-area{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:35px;
  overflow:auto;
}

.paper{
  width:min(720px,75vw);
  height:min(850px,82vh);
  background:white;
  color:#111;
  box-shadow:0 15px 60px rgba(0,0,0,.55);
  overflow:hidden;
  position:relative;
}

.paper-text{
  width:100%;
  height:100%;
  padding:60px;
  white-space:pre-wrap;
  word-break:break-word;
  overflow:auto;
  line-height:1.25;
}

/* ================= STUDIO ================= */

#studio{
  display:none;
  height:calc(100vh - 68px);
  align-items:center;
  justify-content:center;
  overflow:auto;
}

.studio-wrap{
  width:min(760px,94vw);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}

.studio-info{
  text-align:center;
}

.current-char{
  font-size:55px;
  font-weight:800;
  text-shadow:0 0 20px var(--accent);
}

.canvas-wrap{
  width:min(600px,85vw);
  aspect-ratio:1;
  background:#fff;
  border-radius:16px;
  box-shadow:0 0 40px rgba(168,85,247,.22);
  overflow:hidden;
}

#drawCanvas{
  width:100%;
  height:100%;
  touch-action:none;
  cursor:crosshair;
}

.studio-controls{
  width:min(600px,85vw);
  display:flex;
  gap:10px;
}

.studio-controls button{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--panel);
  color:white;
  cursor:pointer;
  font-weight:700;
}

.studio-controls .primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.studio-name{
  width:min(600px,85vw);
  display:flex;
  gap:8px;
}

.studio-name input{
  flex:1;
  padding:12px;
  border-radius:9px;
  border:1px solid var(--border);
  background:#08050d;
  color:white;
}

/* ================= MOBILE ================= */

@media(max-width:750px){

  .generate-sidebar{
    width:220px;
    min-width:220px;
    padding:15px;
  }

  .paper{
    width:70vw;
    height:75vh;
  }

  .paper-text{
    padding:35px;
  }

}

@media(max-width:600px){

  .generate-sidebar{
    width:190px;
    min-width:190px;
  }

  .tab{
    padding:9px 18px;
  }

  .paper-area{
    padding:15px;
  }

}
</style>
</head>

<body>

<!-- ================= PASSWORD ================= -->

<div id="auth">
  <input
    id="password"
    type="password"
    placeholder="Enter password"
    autocomplete="off"
  >
</div>

<!-- ================= APP ================= -->

<div id="app">

  <div class="topbar">

    <button class="settings-button" id="settingsButton">⚙</button>

    <div class="tabs">
      <button class="tab active" id="generateTab">Generate</button>
      <button class="tab" id="studioTab">Studio</button>
    </div>

  </div>

  <!-- SETTINGS -->

  <div class="settings-panel" id="settingsPanel">

    <h2>Settings</h2>

    <div class="setting">
      <label>Interface color</label>
      <input
        class="color-input"
        type="color"
        id="accentColor"
        value="#a855f7"
      >
    </div>

  </div>

  <!-- ================= GENERATE ================= -->

  <section id="generate">

    <aside class="generate-sidebar">

      <h3>Generate</h3>

      <div class="control">
        <label>Font</label>

        <select id="fontSelect"></select>

        <button class="rename-font" id="renameFont">
          Rename font
        </button>

        <button class="delete-font" id="deleteFont">
          Delete font
        </button>
      </div>

      <div class="control">

        <label>
          Text
          <span id="textLength">0</span>
        </label>

        <textarea
          id="textInput"
          rows="6"
          style="
            width:100%;
            resize:vertical;
            padding:10px;
            border-radius:9px;
            border:1px solid var(--border);
            background:#08050d;
            color:white;
            outline:none;
          "
          placeholder="Write something..."
        ></textarea>

      </div>

      <div class="control">

        <label>
          Letter size
          <span id="sizeValue">42</span>
        </label>

        <input
          id="fontSize"
          type="range"
          min="10"
          max="120"
          value="42"
        >

      </div>

      <div class="control">

        <label>
          Letter spacing
          <span id="spacingValue">0</span>
        </label>

        <input
          id="letterSpacing"
          type="range"
          min="-5"
          max="30"
          value="0"
        >

      </div>

      <div class="control">

        <label>Paper background</label>

        <div class="background-buttons">

          <button class="bg-btn" data-bg="#ffffff"
            style="background:#fff"></button>

          <button class="bg-btn" data-bg="#f5f1e8"
            style="background:#f5f1e8"></button>

          <button class="bg-btn" data-bg="#e9eef5"
            style="background:#e9eef5"></button>

          <button class="bg-btn" data-bg="#111111"
            style="background:#111"></button>

        </div>

      </div>

      <div class="control">

        <label>Custom paper color</label>

        <input
          class="color-input"
          type="color"
          id="paperColor"
          value="#ffffff"
        >

      </div>

      <div class="export-buttons">

        <button class="export-btn" id="pngBtn">
          Save as PNG
        </button>

        <button class="export-btn" id="pdfBtn">
          Save as PDF
        </button>

        <button class="export-btn" id="goodnotesBtn">
          Save for GoodNotes
        </button>

      </div>

    </aside>

    <main class="paper-area">

      <div class="paper" id="paper">

        <div
          class="paper-text"
          id="paperText"
        ></div>

      </div>

    </main>

  </section>

  <!-- ================= STUDIO ================= -->

  <section id="studio">

    <div class="studio-wrap">

      <div class="studio-info">

        <div class="current-char" id="currentChar">
          A
        </div>

        <div id="charCounter">
          Character 1
        </div>

      </div>

      <div class="canvas-wrap">

        <canvas id="drawCanvas"></canvas>

      </div>

      <div class="studio-name">

        <input
          id="fontName"
          placeholder="Font name"
          value="My Font"
        >

        <button
          class="studio-controls"
          style="
            flex:0 0 auto;
            width:auto;
            padding:12px 20px;
            border-radius:10px;
            border:1px solid var(--border);
            background:var(--panel);
            color:white;
            cursor:pointer;
          "
          id="newFont"
        >
          New
        </button>

      </div>

      <div class="studio-controls">

        <button id="backBtn">
          ← Back
        </button>

        <button id="clearBtn">
          Clear
        </button>

        <button class="primary" id="nextBtn">
          Next →
        </button>

      </div>

      <div class="studio-controls">

        <button id="saveFontBtn" class="primary">
          Save Font
        </button>

      </div>

    </div>

  </section>

</div>

<script>

/* =========================================================
   PASSWORD
========================================================= */

const FIXED_PASSWORD = "0000";

const auth = document.getElementById("auth");
const passwordInput = document.getElementById("password");
const app = document.getElementById("app");

passwordInput.addEventListener("keydown", e => {

  if(e.key === "Enter"){

    if(passwordInput.value === FIXED_PASSWORD){

      auth.style.display = "none";
      app.style.display = "block";

    }else{

      passwordInput.value = "";

      passwordInput.animate(
        [
          {transform:"translateX(0)"},
          {transform:"translateX(-8px)"},
          {transform:"translateX(8px)"},
          {transform:"translateX(0)"}
        ],
        {duration:250}
      );

    }

  }

});


/* =========================================================
   SETTINGS COLOR
========================================================= */

const accentColor =
  document.getElementById("accentColor");

const savedAccent =
  localStorage.getItem("fontstudio_accent");

if(savedAccent){

  accentColor.value = savedAccent;

  document.documentElement.style
    .setProperty("--accent",savedAccent);

  document.documentElement.style
    .setProperty("--accent2",savedAccent);

}

accentColor.addEventListener("input",()=>{

  const color = accentColor.value;

  document.documentElement.style
    .setProperty("--accent",color);

  document.documentElement.style
    .setProperty("--accent2",color);

  localStorage.setItem(
    "fontstudio_accent",
    color
  );

});


/* =========================================================
   SETTINGS PANEL
========================================================= */

document
  .getElementById("settingsButton")
  .onclick = () => {

    document
      .getElementById("settingsPanel")
      .classList.toggle("open");

  };


/* =========================================================
   TABS
========================================================= */

const generate = document.getElementById("generate");
const studio = document.getElementById("studio");

const generateTab =
  document.getElementById("generateTab");

const studioTab =
  document.getElementById("studioTab");

generateTab.onclick = () => {

  generate.style.display = "flex";
  studio.style.display = "none";

  generateTab.classList.add("active");
  studioTab.classList.remove("active");

};

studioTab.onclick = () => {

  generate.style.display = "none";
  studio.style.display = "flex";

  studioTab.classList.add("active");
  generateTab.classList.remove("active");

};


/* =========================================================
   FONT STORAGE
========================================================= */

let fonts =
  JSON.parse(
    localStorage.getItem("fontstudio_fonts") || "{}"
  );


/*
  Every character stores a PNG image.
  This means the user's handwritten character
  remains available after leaving the website.
*/


function saveFonts(){

  localStorage.setItem(
    "fontstudio_fonts",
    JSON.stringify(fonts)
  );

}


/* =========================================================
   DEFAULT FONT
========================================================= */

if(!fonts["My Font"]){

  fonts["My Font"] = {
    name:"My Font",
    chars:{}
  };

  saveFonts();

}


/* =========================================================
   FONT SELECT
========================================================= */

const fontSelect =
  document.getElementById("fontSelect");

function refreshFontList(){

  const old = fontSelect.value;

  fontSelect.innerHTML = "";

  Object.keys(fonts).forEach(name => {

    const option =
      document.createElement("option");

    option.value = name;
    option.textContent = name;

    fontSelect.appendChild(option);

  });

  if(fonts[old]){

    fontSelect.value = old;

  }

}

refreshFontList();


/* =========================================================
   GENERATE TEXT
========================================================= */

const textInput =
  document.getElementById("textInput");

const paperText =
  document.getElementById("paperText");

const fontSize =
  document.getElementById("fontSize");

const letterSpacing =
  document.getElementById("letterSpacing");

function renderText(){

  const text = textInput.value;

  document.getElementById("textLength")
    .textContent = text.length;

  paperText.innerHTML = "";

  const font =
    fonts[fontSelect.value];

  if(!font) return;

  [...text].forEach((char,index)=>{

    const data = font.chars[char];

    if(data){

      const img =
        document.createElement("img");

      img.src = data;

      img.style.width =
        fontSize.value + "px";

      img.style.height =
        fontSize.value + "px";

      img.style.objectFit = "contain";

      img.style.display = "inline-block";

      img.style.verticalAlign = "middle";

      img.style.marginRight =
        letterSpacing.value + "px";

      paperText.appendChild(img);

    }else{

      const span =
        document.createElement("span");

      span.textContent = char;

      span.style.fontSize =
        fontSize.value + "px";

      span.style.marginRight =
        letterSpacing.value + "px";

      paperText.appendChild(span);

    }

  });

}


textInput.addEventListener("input",renderText);

fontSize.addEventListener("input",()=>{

  document.getElementById("sizeValue")
    .textContent = fontSize.value;

  renderText();

});

letterSpacing.addEventListener("input",()=>{

  document.getElementById("spacingValue")
    .textContent = letterSpacing.value;

  renderText();

});

fontSelect.addEventListener("change",renderText);


/* =========================================================
   PAPER BACKGROUND
========================================================= */

const paper =
  document.getElementById("paper");

document.querySelectorAll(".bg-btn")
.forEach(button => {

  button.onclick = () => {

    paper.style.background =
      button.dataset.bg;

    document.getElementById("paperColor")
      .value = button.dataset.bg;

  };

});

document
  .getElementById("paperColor")
  .addEventListener("input",e=>{

    paper.style.background =
      e.target.value;

  });


/* =========================================================
   STUDIO CHARACTER SET
========================================================= */

/*
  A very broad practical character set.
  Users can move through every character
  with Next / Back.
*/

const characters = [
  ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ",
  ..."abcdefghijklmnopqrstuvwxyz",
  ..."0123456789",
  ..."!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~",
  ..."АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ",
  ..."абвгдеёжзийклмнопрстуфхцчшщъыьэюя",
  ..."€£¥₽©®™°±×÷"
];

let studioIndex = 0;

let studioFontName = "My Font";

let drawing = false;

const canvas =
  document.getElementById("drawCanvas");

const ctx = canvas.getContext("2d");


function setupCanvas(){

  const rect =
    canvas.getBoundingClientRect();

  const ratio =
    window.devicePixelRatio || 1;

  canvas.width =
    rect.width * ratio;

  canvas.height =
    rect.height * ratio;

  ctx.setTransform(
    ratio,0,0,ratio,0,0
  );

  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#111";
  ctx.lineWidth = 6;

  clearCanvas();

}


function clearCanvas(){

  const rect =
    canvas.getBoundingClientRect();

  ctx.fillStyle = "#fff";

  ctx.fillRect(
    0,
    0,
    rect.width,
    rect.height
  );

}


function updateStudio(){

  const char =
    characters[studioIndex];

  document.getElementById("currentChar")
    .textContent =
      char === " " ? "SPACE" : char;

  document.getElementById("charCounter")
    .textContent =
      `Character ${studioIndex + 1} / ${characters.length}`;

  document.getElementById("backBtn")
    .disabled =
      studioIndex === 0;

  clearCanvas();

  const font =
    fonts[studioFontName];

  if(font && font.chars[char]){

    const image =
      new Image();

    image.onload = () => {

      const rect =
        canvas.getBoundingClientRect();

      ctx.drawImage(
        image,
        0,
        0,
        rect.width,
        rect.height
      );

    };

    image.src =
      font.chars[char];

  }

}


function canvasPosition(e){

  const rect =
    canvas.getBoundingClientRect();

  if(e.touches){

    return {
      x:e.touches[0].clientX - rect.left,
      y:e.touches[0].clientY - rect.top
    };

  }

  return {
    x:e.clientX - rect.left,
    y:e.clientY - rect.top
  };

}


function startDrawing(e){

  e.preventDefault();

  drawing = true;

  const p =
    canvasPosition(e);

  ctx.beginPath();

  ctx.moveTo(
    p.x,
    p.y
  );

}


function draw(e){

  if(!drawing) return;

  e.preventDefault();

  const p =
    canvasPosition(e);

  ctx.lineTo(
    p.x,
    p.y
  );

  ctx.stroke();

}


function stopDrawing(){

  drawing = false;

}


canvas.addEventListener(
  "mousedown",
  startDrawing
);

canvas.addEventListener(
  "mousemove",
  draw
);

window.addEventListener(
  "mouseup",
  stopDrawing
);

canvas.addEventListener(
  "touchstart",
  startDrawing,
  {passive:false}
);

canvas.addEventListener(
  "touchmove",
  draw,
  {passive:false}
);

window.addEventListener(
  "touchend",
  stopDrawing
);


/* =========================================================
   STUDIO BUTTONS
========================================================= */

document
  .getElementById("clearBtn")
  .onclick = clearCanvas;


document
  .getElementById("nextBtn")
  .onclick = () => {

    /*
      Save current character first.
    */

    saveCurrentCharacter();

    if(studioIndex < characters.length - 1){

      studioIndex++;

      updateStudio();

    }

};


document
  .getElementById("backBtn")
  .onclick = () => {

    if(studioIndex === 0)
      return;

    saveCurrentCharacter();

    studioIndex--;

    updateStudio();

};


function saveCurrentCharacter(){

  if(!fonts[studioFontName]){

    fonts[studioFontName] = {
      name:studioFontName,
      chars:{}
    };

  }

  const char =
    characters[studioIndex];

  fonts[studioFontName].chars[char] =
    canvas.toDataURL("image/png");

  saveFonts();

}


/* =========================================================
   NEW FONT
========================================================= */

document
  .getElementById("newFont")
  .onclick = () => {

    const name =
      prompt("Font name:");

    if(!name) return;

    const clean =
      name.trim();

    if(!clean) return;

    if(fonts[clean]){

      alert("A font with this name already exists.");

      return;

    }

    fonts[clean] = {
      name:clean,
      chars:{}
    };

    saveFonts();

    studioFontName = clean;

    document.getElementById("fontName")
      .value = clean;

    refreshFontList();

    fontSelect.value = clean;

    studioIndex = 0;

    updateStudio();

};


/* =========================================================
   SAVE FONT
========================================================= */

document
  .getElementById("saveFontBtn")
  .onclick = () => {

    const name =
      document.getElementById("fontName")
        .value.trim();

    if(!name){

      alert("Enter a font name.");

      return;

    }

    if(!fonts[name]){

      fonts[name] = {
        name:name,
        chars:{}
      };

    }

    studioFontName = name;

    saveCurrentCharacter();

    fonts[name].name = name;

    saveFonts();

    refreshFontList();

    fontSelect.value = name;

    alert("Font saved.");

};


/* =========================================================
   RENAME FONT
========================================================= */

document
  .getElementById("renameFont")
  .onclick = () => {

    const oldName =
      fontSelect.value;

    const newName =
      prompt(
        "New font name:",
        oldName
      );

    if(!newName) return;

    const clean =
      newName.trim();

    if(!clean || clean === oldName)
      return;

    if(fonts[clean]){

      alert("A font with this name already exists.");

      return;

    }

    fonts[clean] =
      fonts[oldName];

    fonts[clean].name =
      clean;

    delete fonts[oldName];

    saveFonts();

    if(studioFontName === oldName){

      studioFontName = clean;

      document.getElementById("fontName")
        .value = clean;

    }

    refreshFontList();

    fontSelect.value = clean;

    renderText();

};


/* =========================================================
   DELETE FONT
========================================================= */

document
  .getElementById("deleteFont")
  .onclick = () => {

    const name =
      fontSelect.value;

    if(Object.keys(fonts).length <= 1){

      alert("You need at least one font.");

      return;

    }

    if(!confirm(
      `Delete "${name}"?`
    )) return;

    delete fonts[name];

    saveFonts();

    refreshFontList();

    studioFontName =
      fontSelect.value;

    renderText();

};


/* =========================================================
   PNG EXPORT
========================================================= */

async function exportPNG(){

  const rect =
    paper.getBoundingClientRect();

  const scale = 2;

  const out =
    document.createElement("canvas");

  out.width =
    rect.width * scale;

  out.height =
    rect.height * scale;

  const octx =
    out.getContext("2d");

  octx.scale(scale,scale);

  octx.fillStyle =
    getComputedStyle(paper).backgroundColor;

  octx.fillRect(
    0,
    0,
    rect.width,
    rect.height
  );

  const images =
    paperText.querySelectorAll("img");

  const spans =
    paperText.querySelectorAll("span");

  let x = 60;
  let y = 60;

  const size =
    Number(fontSize.value);

  for(const node of paperText.childNodes){

    if(node.nodeType !== Node.ELEMENT_NODE)
      continue;

    if(node.tagName === "IMG"){

      const image =
        new Image();

      image.src =
        node.src;

      await new Promise(resolve => {

        image.onload = resolve;
        image.onerror = resolve;

      });

      octx.drawImage(
        image,
        x,
        y,
        size,
        size
      );

      x +=
        size +
        Number(letterSpacing.value);

    }

    else if(node.tagName === "SPAN"){

      octx.fillStyle =
        "#111";

      octx.font =
        `${size}px sans-serif`;

      octx.fillText(
        node.textContent,
        x,
        y + size
      );

      x +=
        octx.measureText(
          node.textContent
        ).width +
        Number(letterSpacing.value);

    }

  }

  const link =
    document.createElement("a");

  link.download =
    "fontstudio-page.png";

  link.href =
    out.toDataURL("image/png");

  link.click();

}


/* =========================================================
   PDF EXPORT
========================================================= */

function exportPDF(){

  /*
    Uses the browser's native print dialog.
    Choosing "Save as PDF" creates a PDF
    containing exactly the generated sheet.
  */

  const oldTitle =
    document.title;

  document.title =
    "FontStudio";

  const oldBody =
    document.body.innerHTML;

  const paperHTML =
    paper.outerHTML;

  document.body.innerHTML =
    `<div style="
      width:100vw;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:white;
    ">
      ${paperHTML}
    </div>`;

  window.print();

  document.body.innerHTML =
    oldBody;

  document.title =
    oldTitle;

  location.reload();

}


/* =========================================================
   GOODNOTES
========================================================= */

function exportGoodNotes(){

  /*
    GoodNotes accepts standard PDF files.
    Therefore this produces the same printable
    page format, ready for import into GoodNotes.
  */

  exportPDF();

}


document
  .getElementById("pngBtn")
  .onclick = exportPNG;

document
  .getElementById("pdfBtn")
  .onclick = exportPDF;

document
  .getElementById("goodnotesBtn")
  .onclick = exportGoodNotes;
