<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Handwriting Studio</title>
<style>
:root{--a:#a855f7}
*{box-sizing:border-box}
body{margin:0;background:#090510;color:#eee;font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

#auth{
 position:fixed;inset:0;display:grid;place-items:center;
 background:radial-gradient(circle at center,#24103b,#090510 65%)
}
#pass{
 width:250px;padding:13px 16px;border:1px solid #5b2b78;
 border-radius:12px;background:#160c20;color:white;outline:0;
 text-align:center
}
#pass:focus{border-color:var(--a);box-shadow:0 0 20px #a855f733}

#app{display:none;min-height:100vh;padding:16px}
.top{
 width:min(1100px,100%);margin:auto;height:52px;
 display:flex;align-items:center;gap:8px
}
.tab,.gear{
 border:1px solid #392049;background:#160d20;color:#bbb;
 border-radius:10px;padding:9px 16px
}
.tab.active,.tab:hover,.gear:hover{border-color:var(--a);color:white}
.gear{margin-left:auto;font-size:18px}

.page{
 width:min(1100px,100%);margin:10px auto;
 background:#100818;border:1px solid #2d193a;
 border-radius:16px;padding:14px;min-height:calc(100vh - 100px)
}

#generate{display:flex;gap:14px}
.side{
 width:215px;flex:none;background:#140b1c;border:1px solid #2c1938;
 border-radius:12px;padding:13px
}
.side label{display:block;font-size:12px;color:#999;margin:12px 0 5px}
.side input,.side textarea,.side select{
 width:100%;background:#0c0711;color:white;
 border:1px solid #382044;border-radius:8px;padding:9px;outline:0
}
.side textarea{height:125px;resize:vertical}
.side input:focus,.side textarea:focus,.side select:focus{border-color:var(--a)}
.side button{width:100%;margin-top:9px;padding:9px;border-radius:8px;
 border:1px solid #452453;background:#1b0d27;color:#ddd}
.side button:hover{border-color:var(--a)}

.sheetWrap{
 flex:1;display:flex;justify-content:center;align-items:flex-start;
 padding:4px;overflow:auto
}

/* A4: 210 × 297 */
.sheet{
 width:min(100%,560px);
 aspect-ratio:210/297;
 background:white;
 box-shadow:0 8px 40px #000b;
 overflow:hidden
}
#genCanvas{display:block;width:100%;height:100%}

#studio{display:none;flex-direction:column;align-items:center}
.studioHead{
 width:min(720px,100%);display:flex;align-items:center;
 justify-content:space-between;margin-bottom:10px
}
.counter{color:#aaa;font-size:13px}
.studioBtns{display:flex;gap:7px}
.studioBtns button{
 background:#160c20;border:1px solid #382044;color:#ddd;
 padding:8px 13px;border-radius:8px
}
.studioBtns button:hover{border-color:var(--a)}
.studioBtns button:disabled{opacity:.35;cursor:not-allowed}

.drawWrap{
 width:min(650px,100%);
 background:#160d1e;border:1px solid #33203f;
 border-radius:14px;padding:12px
}
#drawCanvas{
 display:block;width:100%;height:auto;
 background:white;border-radius:7px;
 touch-action:none;cursor:crosshair
}

.settings{
 display:none;position:fixed;inset:0;background:#0009;
 align-items:center;justify-content:center;z-index:10
}
.settingsBox{
 width:300px;background:#130a1b;border:1px solid #472454;
 border-radius:14px;padding:18px;box-shadow:0 15px 60px #000
}
.settingsTop{display:flex;justify-content:space-between;align-items:center}
.close{
 border:0;background:none;color:#aaa;font-size:24px;cursor:pointer
}
.close:hover{color:white}
.settings label{display:block;color:#aaa;font-size:12px;margin-top:18px}
.settings input{width:100%;margin-top:7px}

@media(max-width:700px){
 #app{padding:8px}
 .page{padding:9px}
 #generate{flex-direction:column}
 .side{width:100%}
 .sheet{width:min(100%,480px)}
 .studioHead{flex-wrap:wrap;gap:8px}
}
</style>
</head>

<body>

<div id="auth">
 <input id="pass" type="password" placeholder="Enter password" autocomplete="off">
</div>

<div id="app">

 <div class="top">
  <button class="tab active" id="genTab">Generate</button>
  <button class="tab" id="studioTab">Studio</button>
  <button class="gear" id="settingsBtn">⚙</button>
 </div>

 <section class="page" id="generate">

  <aside class="side">

   <label>Font</label>
   <select id="fontSelect"></select>

   <label>Text</label>
   <textarea id="text">Hello world!
This is my handwriting.</textarea>

   <label>Font size</label>
   <input id="fontSize" type="number" min="10" max="150" value="32">

   <label>Letter spacing</label>
   <input id="letterSpace" type="number" min="0" max="50" value="2">

   <label>Line spacing</label>
   <input id="lineSpace" type="number" min="0" max="100" value="18">

   <label>Text color</label>
   <input id="textColor" type="color" value="#111111">

   <label>Paper color</label>
   <input id="paperColor" type="color" value="#ffffff">

   <button id="newFont">＋ New font</button>
   <button id="renameFont">Rename font</button>
   <button id="deleteFont">Delete font</button>

   <button id="pngBtn">Export PNG</button>
   <button id="pdfBtn">Export PDF</button>
   <button id="goodBtn">GoodNotes</button>

  </aside>

  <div class="sheetWrap">
   <div class="sheet">
    <canvas id="genCanvas"></canvas>
   </div>
  </div>

 </section>

 <section class="page" id="studio">

  <div class="studioHead">
   <div class="counter" id="counter"></div>

   <div class="studioBtns">
    <button id="back">← Back</button>
    <button id="clear">Clear</button>
    <button id="save">Save</button>
    <button id="next">Next →</button>
   </div>
  </div>

  <div class="drawWrap">
   <canvas id="drawCanvas" width="1200" height="700"></canvas>
  </div>

 </section>

</div>

<div class="settings" id="settings">
 <div class="settingsBox">
  <div class="settingsTop">
   <b>Settings</b>
   <button class="close" id="closeSettings">×</button>
  </div>

  <label>Interface / Accent color</label>
  <input id="accent" type="color" value="#a855f7">
 </div>
</div>

<script>
const $=id=>document.getElementById(id);

const chars=[
 ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ",
 ..."abcdefghijklmnopqrstuvwxyz",
 ..."ÄÖÜäöüß",
 ..."0123456789",
 ...`.,!?;:'"-–—_()[]{}/\\@#$%&*+=<>€£¥©®™°§…«»„“”’`
];

let fonts=JSON.parse(localStorage.getItem("hs_fonts")||"null")||{
 "My Font":{glyphs:{}}
};

let currentFont=localStorage.getItem("hs_current")||Object.keys(fonts)[0];
let charIndex=0;
let strokes=[];
let drawing=false;
let activeStroke=null;

/* ---------- AUTH ---------- */

$("pass").addEventListener("keydown",e=>{
 if(e.key==="Enter"){
  if($("pass").value==="0000"){
   $("auth").style.display="none";
   $("app").style.display="block";
   resizeGenerate();
   resizeDraw();
   render();
  }else{
   $("pass").animate(
    [{transform:"translateX(-7px)"},{transform:"translateX(7px)"},{transform:"translateX(0)"}],
    {duration:180}
   );
   $("pass").value="";
  }
 }
});

/* ---------- TABS ---------- */

function tab(which){
 $("generate").style.display=which==="generate"?"flex":"none";
 $("studio").style.display=which==="studio"?"flex":"none";

 $("genTab").classList.toggle("active",which==="generate");
 $("studioTab").classList.toggle("active",which==="studio");

 if(which==="generate"){
  resizeGenerate();
  render();
 }else{
  setTimeout(()=>{
   resizeDraw();
   drawStudio();
  },30);
 }
}

$("genTab").onclick=()=>tab("generate");
$("studioTab").onclick=()=>tab("studio");

/* ---------- SETTINGS ---------- */

let accent=localStorage.getItem("hs_accent")||"#a855f7";
document.documentElement.style.setProperty("--a",accent);
$("accent").value=accent;

$("settingsBtn").onclick=()=>$("settings").style.display="flex";
$("closeSettings").onclick=()=>$("settings").style.display="none";

$("settings").onclick=e=>{
 if(e.target===$("settings")) $("settings").style.display="none";
};

$("accent").oninput=e=>{
 accent=e.target.value;
 document.documentElement.style.setProperty("--a",accent);
 localStorage.setItem("hs_accent",accent);
};

/* ---------- FONTS ---------- */

function saveFonts(){
 localStorage.setItem("hs_fonts",JSON.stringify(fonts));
 localStorage.setItem("hs_current",currentFont);
}

function updateFontList(){
 $("fontSelect").innerHTML="";
 Object.keys(fonts).forEach(name=>{
  let o=document.createElement("option");
  o.value=name;
  o.textContent=name;
  o.selected=name===currentFont;
  $("fontSelect").appendChild(o);
 });
}

$("fontSelect").onchange=e=>{
 currentFont=e.target.value;
 charIndex=0;
 saveFonts();
 loadGlyph();
 render();
};

$("newFont").onclick=()=>{
 let name=prompt("Font name:","My Font "+(Object.keys(fonts).length+1));
 if(!name)return;
 name=name.trim();
 if(!name||fonts[name]){
  alert("That font already exists.");
  return;
 }
 fonts[name]={glyphs:{}};
 currentFont=name;
 saveFonts();
 updateFontList();
 charIndex=0;
 loadGlyph();
 render();
};

$("renameFont").onclick=()=>{
 let name=prompt("New font name:",currentFont);
 if(!name||name===currentFont)return;
 name=name.trim();
 if(!name||fonts[name]){
  alert("That font already exists.");
  return;
 }
 fonts[name]=fonts[currentFont];
 delete fonts[currentFont];
 currentFont=name;
 saveFonts();
 updateFontList();
 render();
};

$("deleteFont").onclick=()=>{
 let names=Object.keys(fonts);
 if(names.length<=1){
  alert("You need at least one font.");
  return;
 }
 if(!confirm("Delete this font?"))return;

 delete fonts[currentFont];
 currentFont=Object.keys(fonts)[0];
 charIndex=0;
 saveFonts();
 updateFontList();
 loadGlyph();
 render();
};

updateFontList();

/* ---------- GENERATOR SETTINGS ---------- */

const genSettings=[
 ["fontSize",32],
 ["letterSpace",2],
 ["lineSpace",18],
 ["textColor","#111111"],
 ["paperColor","#ffffff"]
];

genSettings.forEach(([id,def])=>{
 let saved=localStorage.getItem("hs_setting_"+id);
 if(saved!==null) $(id).value=saved;

 $(id).addEventListener("input",()=>{
  localStorage.setItem("hs_setting_"+id,$(id).value);
  render();
 });
});

$("text").addEventListener("input",render);

/* ---------- DRAWING ---------- */

const dc=$("drawCanvas");
const ctx=dc.getContext("2d");

function resizeDraw(){
 let r=dc.getBoundingClientRect();
 if(!r.width)return;

 let dpr=Math.max(1,window.devicePixelRatio||1);
 dc.width=Math.round(r.width*dpr);
 dc.height=Math.round((r.width*.5833)*dpr);

 ctx.setTransform(dpr,0,0,dpr,0,0);
 drawStudio();
}

function pos(e){
 let r=dc.getBoundingClientRect();
 return {
  x:(e.clientX-r.left)*(dc.clientWidth/r.width),
  y:(e.clientY-r.top)*(dc.clientHeight/r.height)
 };
}

dc.addEventListener("pointerdown",e=>{
 e.preventDefault();
 drawing=true;

 try{dc.setPointerCapture(e.pointerId)}catch{}

 let p=pos(e);
 activeStroke=[p];
 strokes.push(activeStroke);
 drawStudio();
});

dc.addEventListener("pointermove",e=>{
 if(!drawing)return;
 e.preventDefault();

 let p=pos(e);
 activeStroke.push(p);
 drawStudio();
});

function endDraw(e){
 drawing=false;
 activeStroke=null;
 try{dc.releasePointerCapture(e.pointerId)}catch{}
}

dc.addEventListener("pointerup",endDraw);
dc.addEventListener("pointercancel",endDraw);
dc.addEventListener("pointerleave",e=>{
 if(drawing&&e.buttons===0)endDraw(e);
});

function line(points,color,width){
 if(!points.length)return;

 ctx.beginPath();
 ctx.lineCap="round";
 ctx.lineJoin="round";
 ctx.strokeStyle=color;
 ctx.lineWidth=width;

 ctx.moveTo(points[0].x,points[0].y);

 for(let i=1;i<points.length;i++)
  ctx.lineTo(points[i].x,points[i].y);

 if(points.length===1)
  ctx.lineTo(points[0].x+.1,points[0].y+.1);

 ctx.stroke();
}

function guideChar(){
 let ch=chars[charIndex];
 let w=dc.clientWidth;
 let h=dc.clientHeight;

 ctx.save();
 ctx.font=`${Math.min(w,h)*.42}px Arial`;
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillStyle="rgba(120,120,120,.22)";
 ctx.fillText(ch,w/2,h*.51);
 ctx.restore();
}

function drawStudio(){
 let w=dc.clientWidth;
 let h=dc.clientHeight;

 if(!w)return;

 ctx.clearRect(0,0,w,h);

 ctx.fillStyle="#fff";
 ctx.fillRect(0,0,w,h);

 /* notebook lines */
 ctx.lineWidth=2;
 ctx.strokeStyle="rgba(220,40,40,.35)";

 [.22,.42,.62,.82].forEach(y=>{
  ctx.beginPath();
  ctx.moveTo(0,h*y);
  ctx.lineTo(w,h*y);
  ctx.stroke();
 });

 guideChar();

 /* user's writing */
 for(const s of strokes)
  line(s,"#111",Math.max(3,w/170));
}

function saveGlyph(){
 let ch=chars[charIndex];

 fonts[currentFont].glyphs[ch]={
  strokes:JSON.parse(JSON.stringify(strokes)),
  width:dc.clientWidth,
  height:dc.clientHeight
 };

 saveFonts();
 render();
}

$("save").onclick=saveGlyph;

$("clear").onclick=()=>{
 strokes=[];
 drawStudio();
};

$("back").onclick=()=>{
 if(charIndex<=0)return;
 saveGlyph();
 charIndex--;
 loadGlyph();
};

$("next").onclick=()=>{
 if(charIndex>=chars.length-1)return;
 saveGlyph();
 charIndex++;
 loadGlyph();
};

function loadGlyph(){
 let ch=chars[charIndex];
 let g=fonts[currentFont].glyphs[ch];

 strokes=g?.strokes?JSON.parse(JSON.stringify(g.strokes)):[];
 $("counter").textContent=`${charIndex+1} / ${chars.length}  •  "${ch}"`;

 $("back").disabled=charIndex===0;
 $("next").disabled=charIndex===chars.length-1;

 drawStudio();
}

/* ---------- GENERATION ---------- */

const gc=$("genCanvas");
const gx=gc.getContext("2d");

function resizeGenerate(){
 let r=gc.getBoundingClientRect();
 if(!r.width)return;

 let dpr=2;
 gc.width=Math.round(r.width*dpr);
 gc.height=Math.round(r.height*dpr);
 gx.setTransform(dpr,0,0,dpr,0,0);
}

function drawGlyph(g,x,y,size,color){
 if(!g?.strokes?.length)return;

 let sx=size/100;
 let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;

 g.strokes.forEach(s=>s.forEach(p=>{
  minX=Math.min(minX,p.x);
  minY=Math.min(minY,p.y);
  maxX=Math.max(maxX,p.x);
  maxY=Math.max(maxY,p.y);
 }));

 if(!isFinite(minX))return;

 gx.save();
 gx.translate(x-minX*sx,y-minY*sx);
 gx.scale(sx,sx);

 g.strokes.forEach(s=>{
  gx.beginPath();
  gx.strokeStyle=color;
  gx.lineWidth=Math.max(2,(g.width||1200)/170);
  gx.lineCap="round";
  gx.lineJoin="round";

  s.forEach((p,i)=>{
   if(i)gx.lineTo(p.x,p.y);
   else gx.moveTo(p.x,p.y);
  });

  gx.stroke();
 });

 gx.restore();

 return (maxX-minX)*sx;
}

function render(){
 let w=gc.clientWidth;
 let h=gc.clientHeight;
 if(!w||!h)return;

 gx.clearRect(0,0,w,h);

 gx.fillStyle=$("paperColor").value;
 gx.fillRect(0,0,w,h);

 let size=+($("fontSize").value||32);
 let letter=+($("letterSpace").value||0);
 let lineGap=+($("lineSpace").value||0);

 let text=$("text").value;
 let color=$("textColor").value;

 let left=35;
 let top=45;
 let maxW=w-70;

 let lineHeight=size+lineGap;
 let y=top;

 for(let row of text.split("\n")){
  let x=left;

  for(let ch of row){
   let g=fonts[currentFont].glyphs[ch];

   if(g){
    let advance=drawGlyph(g,x,y,size,color);
    x+=advance+letter;
   }else{
    gx.save();
    gx.font=`${size}px Arial`;
    gx.fillStyle=color;
    gx.textBaseline="top";
    gx.fillText(ch,x,y);
    x+=gx.measureText(ch).width+letter;
    gx.restore();
   }

   /* wrap automatically */
   if(x>maxW){
    x=left;
    y+=lineHeight;
   }
  }

  y+=lineHeight;
 }
}

/* ---------- EXPORT ---------- */

function exportPNG(){
 let link=document.createElement("a");
 link.download="handwriting-A4.png";
 link.href=gc.toDataURL("image/png");
 link.click();
}

$("pngBtn").onclick=exportPNG;

function printSheet(){
 let data=gc.toDataURL("image/png");

 let win=window.open("","_blank");
 if(!win)return;

 win.document.write(`
 <!DOCTYPE html>
 <html>
 <head>
 <title>Handwriting A4</title>
 <style>
 @page{size:A4;margin:0}
 *{box-sizing:border-box}
 html,body{margin:0;padding:0;background:white}
 img{width:210mm;height:297mm;display:block}
 </style>
 </head>
 <body>
 <img src="${data}">
 <script>
 window.onload=()=>setTimeout(()=>window.print(),300);
 <\/script>
 </body>
 </html>
 `);

 win.document.close();
}

$("pdfBtn").onclick=printSheet;
$("goodBtn").onclick=printSheet;

/* ---------- WINDOW ---------- */

window.addEventListener("resize",()=>{
 if($("studio").style.display!=="none")resizeDraw();
 else resizeGenerate();
 render();
});

loadGlyph();
resizeGenerate();
render();
</script>

</body>
</html>
