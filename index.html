<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Handwriting Studio</title>
<style>
:root{--a:#a855f7;--a2:#c084fc;--bg:#08050d;--p:#12091b;--b:#a855f755;--m:#c9a6e8}
*{box-sizing:border-box;margin:0}
html,body,#app{width:100%;height:100%}
body{background:radial-gradient(circle at top,#301050,#08050d 65%);color:#fff;font:14px Arial,sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit}

#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#08050d;z-index:99}
#pass{width:330px;padding:15px;border:1px solid var(--b);border-radius:12px;background:#0d0813;color:#fff;text-align:center;outline:0}

#app{display:none}
.top{height:65px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--b);background:#09050dcc;position:relative}
.tabs{display:flex;gap:5px;padding:5px;border:1px solid var(--b);border-radius:12px}
.tab{border:0;background:none;color:var(--m);padding:9px 30px;border-radius:8px;cursor:pointer}
.tab.active{background:linear-gradient(135deg,var(--a),var(--a2));color:white}
.gear{position:absolute;left:15px;width:38px;height:38px;border:1px solid var(--b);border-radius:10px;background:#150b20;color:white;cursor:pointer}

#settings{position:fixed;z-index:50;left:-290px;top:0;width:280px;height:100%;padding:22px;background:#0d0615f7;border-right:1px solid var(--b);transition:.25s}
#settings.open{left:0}
.sethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.close{width:35px;height:35px;border:1px solid var(--b);border-radius:9px;background:#160b20;color:white;font-size:21px;cursor:pointer}
#accent{width:100%;height:42px;padding:3px;background:#111;border:1px solid var(--b);border-radius:8px}

#generate{height:calc(100% - 65px);display:flex}
.side{width:270px;min-width:270px;padding:20px;background:#0d0714dd;border-right:1px solid var(--b);overflow:auto}
.side h2{margin-bottom:20px}
.control{margin-bottom:17px}
.control label{display:flex;justify-content:space-between;color:var(--m);font-size:12px;margin-bottom:7px}
select,textarea{width:100%;border:1px solid var(--b);border-radius:8px;background:#09050d;color:white;outline:0}
select{height:40px;padding:0 9px}
textarea{height:115px;padding:10px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--a)}
.color{width:100%;height:38px;padding:2px;border:1px solid var(--b);border-radius:8px;background:#111}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.btn{padding:9px;border:1px solid var(--b);border-radius:8px;background:#160b20;color:#fff;cursor:pointer}
.danger{width:100%;margin-top:7px;padding:9px;border:1px solid #ef444477;border-radius:8px;background:none;color:#ff8888;cursor:pointer}
.exports{display:grid;gap:8px;margin-top:25px}
.export{padding:11px;border:0;border-radius:8px;background:linear-gradient(135deg,var(--a),var(--a2));color:white;font-weight:bold;cursor:pointer}

.paperArea{flex:1;display:flex;align-items:center;justify-content:center;padding:25px;overflow:auto}
.paper{width:min(720px,75vw);height:min(850px,85vh);min-width:400px;min-height:500px;background:white;box-shadow:0 20px 60px #0008}
#genCanvas{width:100%;height:100%;display:block}

#studio{display:none;height:calc(100% - 65px);align-items:center;justify-content:center;overflow:auto}
.studioBox{width:min(620px,92vw);display:flex;flex-direction:column;gap:13px;align-items:center;padding:20px 0}
.studioTop,.nameRow,.actions{width:100%;display:flex;gap:8px}
.studioTop select,.nameRow input{flex:1}
.studioTop button,.nameRow button,.actions button{padding:10px;border:1px solid var(--b);border-radius:8px;background:#160b20;color:white;cursor:pointer}
.nameRow button,.actions .next{background:linear-gradient(135deg,var(--a),var(--a2));border:0}
.char{font-size:52px;font-weight:bold;text-shadow:0 0 20px var(--a)}
.counter{font-size:12px;color:var(--m)}
.canvasBox{width:100%;aspect-ratio:1;background:white;border-radius:14px;overflow:hidden;box-shadow:0 0 40px #a855f733}
#drawCanvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.nameRow input{padding:10px;border:1px solid var(--b);border-radius:8px;background:#09050d;color:white;outline:0}
.actions button{flex:1}
.actions button:disabled{opacity:.3}
.hint{font-size:11px;color:#ffffff66;text-align:center}

@media(max-width:700px){
 .side{width:210px;min-width:210px;padding:13px}
 .paper{min-width:300px}
 .tab{padding:9px 18px}
}
</style>
</head>

<body>

<div id="auth">
<input id="pass" type="password" placeholder="Enter password">
</div>

<div id="app">

<div class="top">
<button class="gear" id="gear">⚙</button>
<div class="tabs">
<button class="tab active" id="gtab">Generate</button>
<button class="tab" id="stab">Studio</button>
</div>
</div>

<div id="settings">
<div class="sethead">
<h2>Settings</h2>
<button class="close" id="close">×</button>
</div>
<label style="color:var(--m)">Interface color</label>
<input id="accent" type="color" value="#a855f7">
</div>

<!-- GENERATE -->
<section id="generate">

<aside class="side">
<h2>Generate</h2>

<div class="control">
<label>Font</label>
<select id="fontSelect"></select>
<div class="btns" style="margin-top:7px">
<button class="btn" id="rename">Rename</button>
<button class="btn" id="new1">New</button>
</div>
<button class="danger" id="delete">Delete font</button>
</div>

<div class="control">
<label>Text <span id="len">0</span></label>
<textarea id="text" placeholder="Write something..."></textarea>
</div>

<div class="control">
<label>Font size <span id="sv">42</span></label>
<input id="size" type="range" min="10" max="120" value="42">
</div>

<div class="control">
<label>Letter spacing <span id="spv">0</span></label>
<input id="spacing" type="range" min="-10" max="40" value="0">
</div>

<div class="control">
<label>Text color</label>
<input class="color" id="textColor" type="color" value="#111111">
</div>

<div class="control">
<label>Paper background</label>
<input class="color" id="paperColor" type="color" value="#ffffff">
</div>

<div class="exports">
<button class="export" id="png">Save as PNG</button>
<button class="export" id="pdf">Save as PDF</button>
<button class="export" id="good">Save for GoodNotes</button>
</div>
</aside>

<div class="paperArea">
<div class="paper"><canvas id="genCanvas"></canvas></div>
</div>

</section>


<!-- STUDIO -->
<section id="studio">

<div class="studioBox">

<div class="studioTop">
<select id="studioFont"></select>
<button id="new2">New font</button>
</div>

<div class="char" id="char">A</div>
<div class="counter" id="counter">1 / 124</div>

<div class="canvasBox">
<canvas id="drawCanvas"></canvas>
</div>

<div class="nameRow">
<input id="fontName" placeholder="Font name">
<button id="saveFont">Save font</button>
</div>

<div class="actions">
<button id="back">← Back</button>
<button id="clear">Clear</button>
<button class="next" id="next">Next →</button>
</div>

<div class="hint">
Write with black over the gray character. The red lines are guides only.
</div>

</div>
</section>

</div>

<script>

/* ================= PASSWORD ================= */

const $=id=>document.getElementById(id);

$("pass").onkeydown=e=>{
if(e.key==="Enter"){
if($("pass").value==="0000"){
$("auth").style.display="none";
$("app").style.display="block";
setTimeout(init,50);
}else{
$("pass").value="";
$("pass").animate(
[{transform:"translateX(-7px)"},{transform:"translateX(7px)"},{transform:"translateX(0)"}],
{duration:220}
);
}
}};


/* ================= SETTINGS ================= */

$("gear").onclick=()=>$("settings").classList.add("open");
$("close").onclick=()=>$("settings").classList.remove("open");

let ac=localStorage.getItem("hs_accent");
if(ac){
$("accent").value=ac;
document.documentElement.style.setProperty("--a",ac);
document.documentElement.style.setProperty("--a2",ac);
}

$("accent").oninput=()=>{
let c=$("accent").value;
document.documentElement.style.setProperty("--a",c);
document.documentElement.style.setProperty("--a2",c);
localStorage.setItem("hs_accent",c);
};


/* ================= FONTS ================= */

let fonts=JSON.parse(localStorage.getItem("hs_fonts")||"{}");

if(!Object.keys(fonts).length){
fonts["My Font"]={glyphs:{}};
localStorage.setItem("hs_fonts",JSON.stringify(fonts));
}

function saveFonts(){
localStorage.setItem("hs_fonts",JSON.stringify(fonts));
}

const chars=[
..."ABCDEFGHIJKLMNOPQRSTUVWXYZ",
..."abcdefghijklmnopqrstuvwxyz",
..."ÄÖÜäöüß",
..."0123456789",
...`.,!?;:'"-–—_()[]{}/\\@#$%&*+=<>€£¥©®™°§…«»„“”’`
];

let fontName="My Font";
let index=0;

function lists(){

$("fontSelect").innerHTML="";
$("studioFont").innerHTML="";

Object.keys(fonts).forEach(n=>{
let a=new Option(n,n);
let b=new Option(n,n);
$("fontSelect").add(a);
$("studioFont").add(b);
});

$("fontSelect").value=fontName;
$("studioFont").value=fontName;
}

lists();


/* ================= TABS ================= */

$("gtab").onclick=()=>{
$("generate").style.display="flex";
$("studio").style.display="none";
$("gtab").classList.add("active");
$("stab").classList.remove("active");
render();
};

$("stab").onclick=()=>{
$("generate").style.display="none";
$("studio").style.display="flex";
$("stab").classList.add("active");
$("gtab").classList.remove("active");
setTimeout(()=>{
resizeDraw();
loadGlyph();
},30);
};


/* ================= GENERATE ================= */

const gc=$("genCanvas"),gx=gc.getContext("2d");

function resizeGen(){
let r=gc.parentElement.getBoundingClientRect(),d=devicePixelRatio||1;
gc.width=r.width*d;
gc.height=r.height*d;
gc.style.width=r.width+"px";
gc.style.height=r.height+"px";
gx.setTransform(d,0,0,d,0,0);
render();
}

function render(){

if(!gc.width)return;

let r=gc.getBoundingClientRect(),w=r.width,h=r.height;
gx.fillStyle=$("paperColor").value;
gx.fillRect(0,0,w,h);

let f=fonts[$("fontSelect").value];
if(!f)return;

let text=$("text").value;
let size=+$("size").value;
let spacing=+$("spacing").value;

$("len").textContent=text.length;
$("sv").textContent=size;
$("spv").textContent=spacing;

let x=size,y=20,line=size*1.35;

for(let ch of text){

if(ch==="\n"){
x=size;y+=line;continue;
}

let g=f.glyphs[ch];

if(!g){

gx.fillStyle=$("textColor").value;
gx.font=size+"px Arial";
gx.textBaseline="top";

let ww=gx.measureText(ch).width;

if(x+ww>w-size){
x=size;y+=line;
}

gx.fillText(ch,x,y);
x+=ww+spacing;
continue;
}

let bw=g.box.w||100;
let scale=size/100;
let ww=bw*scale;

if(x+ww>w-size){
x=size;y+=line;
}

gx.strokeStyle=$("textColor").value;
gx.lineWidth=(g.pen||5)*scale;
gx.lineCap="round";
gx.lineJoin="round";

g.strokes.forEach(s=>{
if(!s.length)return;
gx.beginPath();
s.forEach((p,i)=>{
let px=x+(p.x-g.box.x)*scale;
let py=y+(p.y-g.box.y)*scale;
i?gx.lineTo(px,py):gx.moveTo(px,py);
});
gx.stroke();
});

x+=ww+spacing;
if(y+line>h)break;
}
}

$("text").oninput=render;
$("size").oninput=render;
$("spacing").oninput=render;
$("textColor").oninput=render;
$("paperColor").oninput=render;

$("fontSelect").onchange=()=>{
fontName=$("fontSelect").value;
$("studioFont").value=fontName;
render();
};


/* ================= STUDIO CANVAS ================= */

const dc=$("drawCanvas"),dx=dc.getContext("2d");
let W=0,H=0;
let strokes=[];
let active=null;

function resizeDraw(){

let r=dc.getBoundingClientRect(),d=devicePixelRatio||1;
W=r.width;
H=r.height;

dc.width=W*d;
dc.height=H*d;
dx.setTransform(d,0,0,d,0,0);
draw();
}

function draw(){

dx.clearRect(0,0,W,H);
dx.fillStyle="#fff";
dx.fillRect(0,0,W,H);

/* red notebook lines */
dx.strokeStyle="rgba(220,40,50,.38)";
dx.lineWidth=1.5;

[.22,.42,.62,.82].forEach(v=>{
let y=H*v;
dx.beginPath();
dx.moveTo(0,y);
dx.lineTo(W,y);
dx.stroke();
});

/* gray character */
let c=chars[index];

if(c!==" "){
dx.fillStyle="rgba(70,70,70,.20)";
dx.font="500 "+H*.58+"px Arial";
dx.textAlign="center";
dx.textBaseline="middle";
dx.fillText(c,W/2,H*.52);
}

/* black writing */
dx.strokeStyle="#000";
dx.lineWidth=5;
dx.lineCap="round";
dx.lineJoin="round";

strokes.forEach(s=>{
if(!s.length)return;
dx.beginPath();
s.forEach((p,i)=>{
i?dx.lineTo(p.x,p.y):dx.moveTo(p.x,p.y);
});
dx.stroke();
});
}


/* ================= REAL DRAWING ================= */

dc.onpointerdown=e=>{
e.preventDefault();
dc.setPointerCapture(e.pointerId);

let r=dc.getBoundingClientRect();

active=[];
strokes.push(active);

active.push({
x:e.clientX-r.left,
y:e.clientY-r.top
});

draw();
};

dc.onpointermove=e=>{
if(!active)return;

e.preventDefault();

let r=dc.getBoundingClientRect();

active.push({
x:e.clientX-r.left,
y:e.clientY-r.top
});

draw();
};

function stop(){
active=null;
}

dc.onpointerup=stop;
dc.onpointercancel=stop;


/* ================= SAVE GLYPH ================= */

function saveGlyph(){

let f=fonts[fontName];
if(!f)return;

let c=chars[index];

if(!strokes.length){
delete f.glyphs[c];
saveFonts();
return;
}

let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;

strokes.forEach(s=>s.forEach(p=>{
minX=Math.min(minX,p.x);
minY=Math.min(minY,p.y);
maxX=Math.max(maxX,p.x);
maxY=Math.max(maxY,p.y);
}));

if(!isFinite(minX))return;

let pad=8;
minX-=pad;
minY-=pad;
maxX+=pad;
maxY+=pad;

f.glyphs[c]={
strokes:strokes.map(s=>s.map(p=>({x:p.x,y:p.y}))),
box:{
x:minX,
y:minY,
w:maxX-minX,
h:maxY-minY
},
pen:5
};

saveFonts();
}


/* ================= LOAD GLYPH ================= */

function loadGlyph(){

let f=fonts[fontName];
let g=f&&f.glyphs[chars[index]];

strokes=g
?g.strokes.map(s=>s.map(p=>({x:p.x,y:p.y})))
:[];

$("char").textContent=chars[index];
$("counter").textContent=(index+1)+" / "+chars.length;
$("back").disabled=index===0;
$("fontName").value=fontName;

draw();
}


/* ================= NEXT/BACK ================= */

$("next").onclick=()=>{
saveGlyph();
if(index<chars.length-1){
index++;
loadGlyph();
}
};

$("back").onclick=()=>{
if(index===0)return;
saveGlyph();
index--;
loadGlyph();
};

$("clear").onclick=()=>{
strokes=[];
saveGlyph();
draw();
};


/* ================= FONT SAVE ================= */

$("saveFont").onclick=()=>{

let n=$("fontName").value.trim();

if(!n)return;

if(n!==fontName&&fonts[n]){
alert("A font with this name already exists.");
return;
}

if(n!==fontName){
fonts[n]=fonts[fontName];
delete fonts[fontName];
fontName=n;
}

saveGlyph();
saveFonts();
lists();

$("fontSelect").value=fontName;
$("studioFont").value=fontName;
render();
};


/* ================= NEW FONT ================= */

function newFont(){

let n=prompt("Enter the new font name:");
if(!n)return;

n=n.trim();
if(!n)return;

if(fonts[n]){
alert("A font with this name already exists.");
return;
}

fonts[n]={glyphs:{}};
fontName=n;
index=0;
strokes=[];

saveFonts();
lists();
loadGlyph();
}

$("new1").onclick=newFont;
$("new2").onclick=newFont;


/* ================= RENAME ================= */

$("rename").onclick=()=>{

let old=$("fontSelect").value;
let n=prompt("New font name:",old);

if(!n)return;

n=n.trim();

if(!n||n===old)return;

if(fonts[n]){
alert("A font with this name already exists.");
return;
}

fonts[n]=fonts[old];
delete fonts[old];

if(fontName===old)fontName=n;

saveFonts();
lists();

$("fontSelect").value=fontName;
$("studioFont").value=fontName;

loadGlyph();
render();
};


/* ================= DELETE ================= */

$("delete").onclick=()=>{

let n=$("fontSelect").value;

if(Object.keys(fonts).length<=1){
alert("You need at least one font.");
return;
}

if(!confirm("Delete "+n+"?"))return;

delete fonts[n];

if(fontName===n)
fontName=Object.keys(fonts)[0];

saveFonts();
lists();
loadGlyph();
render();
};


/* ================= STUDIO FONT CHANGE ================= */

$("studioFont").onchange=()=>{
saveGlyph();
fontName=$("studioFont").value;
$("fontSelect").value=fontName;
index=0;
loadGlyph();
};


/* ================= PNG ================= */

$("png").onclick=()=>{

render();

gc.toBlob(blob=>{
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="handwriting-sheet.png";
a.click();
setTimeout(()=>URL.revokeObjectURL(a.href),500);
},"image/png");

};


/* ================= PDF / GOODNOTES ================= */

function printPDF(){

render();

let data=gc.toDataURL("image/png");

let w=window.open("","_blank");

if(!w){
alert("Please allow pop-ups.");
return;
}

w.document.write(`
<html>
<head>
<title>Handwriting Sheet</title>
<style>
html,body{margin:0;width:100%;height:100%}
body{display:flex;align-items:center;justify-content:center}
img{width:100%;height:100%;object-fit:contain}
@page{margin:0}
</style>
</head>
<body>
<img src="${data}">
<script>
window.onload=()=>setTimeout(()=>window.print(),300);
<\/script>
</body>
</html>
`);

w.document.close();
}

$("pdf").onclick=printPDF;
$("good").onclick=printPDF;


/* ================= INIT ================= */

function init(){

resizeGen();
resizeDraw();
loadGlyph();
render();

}

window.onresize=()=>{
if($("studio").style.display!=="none"){
resizeDraw();
draw();
}else{
resizeGen();
}
};

</script>
</body>
</html>
