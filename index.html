<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Handwriting Studio</title>

<style>
:root{--a:#a855f7}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#090510;color:#eee;font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

#auth{
 position:fixed;inset:0;display:grid;place-items:center;
 background:radial-gradient(circle at center,#24103b,#090510 65%)
}
#auth .authBox{
 display:flex;flex-direction:column;align-items:center;gap:10px
}
#pass{
 width:250px;padding:13px 16px;border:1px solid #5b2b78;
 border-radius:12px;background:#160c20;color:white;outline:0;
 text-align:center;box-sizing:border-box
}
#loginBtn{
 width:250px;padding:11px 16px;border:1px solid #5b2b78;
 border-radius:10px;background:#1d0d29;color:white
}
#loginBtn:hover{border-color:var(--a);background:#241033}
.adminHint{
 margin-top:2px;color:#8d7b99;font-size:12px;text-align:center
}
.adminHint b{color:#b99acb;font-weight:600}
#pass:focus{border-color:var(--a);box-shadow:0 0 20px #a855f733}

#app{display:none;width:100%;height:100vh;padding:10px;overflow:hidden}

.top{
 width:100%;height:42px;display:flex;align-items:center;gap:7px
}
.tab,.gear{
 border:1px solid #392049;background:#160d20;color:#bbb;
 border-radius:9px;padding:7px 14px
}
.tab.active,.tab:hover,.gear:hover{border-color:var(--a);color:white}
.gear{margin-left:auto;font-size:17px}

.page{
 width:100%;height:calc(100vh - 62px);
 background:#100818;border:1px solid #2d193a;
 border-radius:14px;padding:10px
}

#generate{display:flex;gap:10px;overflow:hidden}

.side{
 width:200px;min-width:200px;height:100%;
 background:#140b1c;border:1px solid #2c1938;
 border-radius:11px;padding:10px;overflow:hidden
}
.side label{
 display:block;font-size:11px;color:#999;margin:7px 0 4px
}
.side input,.side textarea,.side select{
 width:100%;background:#0c0711;color:white;
 border:1px solid #382044;border-radius:7px;padding:7px;outline:0
}
.side textarea{height:75px;resize:none}
.side input:focus,.side textarea:focus,.side select:focus{border-color:var(--a)}
.side button{
 width:100%;margin-top:6px;padding:7px;border-radius:7px;
 border:1px solid #452453;background:#1b0d27;color:#ddd;font-size:12px
}
.side button:hover{border-color:var(--a)}

.sheetWrap{
 flex:1;min-width:0;min-height:0;display:flex;
 justify-content:center;align-items:center;overflow:hidden
}
.sheet{
 height:min(100%,calc((100vw - 250px)*1.414));
 width:auto;aspect-ratio:210/297;max-width:100%;
 background:white;box-shadow:0 8px 40px #000b;overflow:hidden
}
#genCanvas{display:block;width:100%;height:100%}

#studio{
 display:none;flex-direction:column;align-items:center;
 justify-content:center;gap:8px;overflow:hidden
}

.studioHead{
 width:min(820px,100%);display:flex;align-items:center;
 justify-content:space-between;gap:8px;flex:none
}
.counter{color:#aaa;font-size:12px;white-space:nowrap}

.studioBtns{
 display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end
}
.studioBtns button{
 background:#160c20;border:1px solid #382044;color:#ddd;
 padding:7px 9px;border-radius:7px;font-size:12px
}
.studioBtns button:hover{border-color:var(--a)}
.studioBtns button:disabled{opacity:.35;cursor:not-allowed}

.drawWrap{
 width:min(720px,100%);max-height:calc(100% - 50px);
 background:#160d1e;border:1px solid #33203f;
 border-radius:11px;padding:8px;overflow:hidden
}
#drawCanvas{
 display:block;width:100%;height:auto;max-height:100%;
 background:white;border-radius:6px;touch-action:none;cursor:crosshair
}

.settings{
 display:none;position:fixed;inset:0;background:#0009;
 align-items:center;justify-content:center;z-index:10
}
.settingsBox{
 width:280px;background:#130a1b;border:1px solid #472454;
 border-radius:13px;padding:16px;box-shadow:0 15px 60px #000
}
.settingsTop{display:flex;justify-content:space-between;align-items:center}
.close{border:0;background:none;color:#aaa;font-size:23px;cursor:pointer}
.close:hover{color:white}
.settings label{display:block;color:#aaa;font-size:12px;margin-top:16px}
.settings input{width:100%;margin-top:6px}

@media(max-height:700px){
 #app{padding:7px}
 .top{height:36px}
 .page{height:calc(100vh - 50px);padding:7px}
 .side{width:180px;min-width:180px;padding:8px}
 .side label{margin:4px 0 2px;font-size:10px}
 .side input,.side textarea,.side select{padding:5px}
 .side textarea{height:55px}
 .side button{padding:5px;margin-top:4px;font-size:11px}
 .tab,.gear{padding:5px 11px}
 .studioBtns button{padding:5px 8px;font-size:11px}
}

@media(max-width:600px){
 #generate{flex-direction:column}
 .side{
  width:100%;min-width:0;height:auto;display:grid;
  grid-template-columns:repeat(2,1fr);gap:5px;overflow:hidden
 }
 .side label{margin:2px 0}
 .side textarea{height:42px}
 .side button{margin:0}
 .sheetWrap{min-height:0}
 .sheet{height:100%;max-height:100%}
 .studioHead{flex-direction:column;align-items:center}
 .studioBtns{justify-content:center}
}

@media(max-height:550px){
 .side{grid-template-columns:repeat(3,1fr)}
}

.adminActions button{

.adminList{display:flex;flex-direction:column;gap:7px}
.adminUser{

.adminUserBtns button:hover{border-color:var(--a)}
.adminUserBtns .kick{border-color:#7a4b19}

@media(max-width:600px){

.codePrice b{

async function getTechnicalInfo(){

 let country="Unknown";

 try{
  const response=await fetch("https://ipapi.co/country_name/",{
   cache:"no-store"
  });
  if(response.ok){
   country=(await response.text()).trim()||"Unknown";
  }
 }catch{}

 const ua=navigator.userAgent;

 let browser=
  /Edg/i.test(ua)?"Edge":
  /Chrome/i.test(ua)?"Chrome":
  /Firefox/i.test(ua)?"Firefox":
  /Safari/i.test(ua)?"Safari":"Unknown";

 let os=
  /Windows/i.test(ua)?"Windows":
  /Android/i.test(ua)?"Android":
  /iPhone|iPad|iPod/i.test(ua)?"iOS":
  /Mac OS/i.test(ua)?"macOS":
  /Linux/i.test(ua)?"Linux":"Unknown";

 let device=
  /iPad/i.test(ua)?"iPad":
  /iPhone/i.test(ua)?"iPhone":
  /Android/i.test(ua)?"Android device":
  /Mobi/i.test(ua)?"Mobile":
  "Desktop";

 return {
  code:firebaseAccessCode,
  sessionId:firebaseUid,
  device,
  browser,
  os,
  country,
  language:navigator.language||"Unknown",
  timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"Unknown",
  screen:`${screen.width} × ${screen.height}`,
  pixelRatio:window.devicePixelRatio||1,
  touchPoints:navigator.maxTouchPoints||0,
  platform:navigator.platform||"Unknown",
  joinedAt:Date.now(),
  lastSeen:Date.now(),
  online:true,
  userAgent:ua
 };
}

async function registerFirebaseUser(method){

 const info=await getTechnicalInfo();
 info.loginMethod=method;

 await db.ref("users/"+firebaseUid).update(info);

 const presence=db.ref("presence/"+firebaseUid);
 await presence.onDisconnect().update({
  online:false,
  lastSeen:Date.now()
 });

 await presence.set(info);

 setInterval(()=>{
  db.ref("presence/"+firebaseUid).update({
   online:true,
   lastSeen:Date.now()
  });
  db.ref("users/"+firebaseUid).update({
   lastSeen:Date.now()
  });
 },10000);
}

/* TABS */

function tab(which){

 $("generate").style.display=
  which==="generate"?"flex":"none";

 $("studio").style.display=
  which==="studio"?"flex":"none";

 $("genTab").classList.toggle(
  "active",which==="generate"
 );

 $("studioTab").classList.toggle(
  "active",which==="studio"
 );

 setTimeout(()=>{

  if(which==="generate"){
   resizeGenerate();
   render();
  }else{
   resizeDraw();
   drawStudio();
  }

 },20);
}

$("genTab").onclick=()=>tab("generate");

/* ADMIN PANEL */

function escapeHtml(v){
 return String(v??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}

async function refreshAdminUsers(){

 if(!firebaseIsAdmin)return;

 const snap=await db.ref("presence").once("value");
 const users=snap.val()||{};
 const list=$("adminUsers");

 list.innerHTML="";

 const online=Object.values(users).filter(u=>u && u.online!==false);

 if(!online.length){
  list.innerHTML='<div style="color:#777;font-size:12px">No online users.</div>';
  return;
 }

 online.forEach(u=>{
  const row=document.createElement("div");
  row.className="adminUser";

  row.innerHTML=`
   <div class="adminUserInfo">
    <div class="adminUserCode">${escapeHtml(u.code||"Unknown")}</div>
    <div class="adminUserMeta">${escapeHtml(u.device||"Unknown")} • ${escapeHtml(u.country||"Unknown")}</div>
   </div>
   <div class="adminUserBtns">
    <button data-action="more">More</button>
    <button class="kick" data-action="kick">Kick</button>
    <button class="ban" data-action="ban">Ban</button>
   </div>
  `;

  row.querySelector('[data-action="more"]').onclick=()=>showUserDetails(u);
  row.querySelector('[data-action="kick"]').onclick=()=>adminKick(u.sessionId);
  row.querySelector('[data-action="ban"]').onclick=()=>adminBan(u.sessionId);

  list.appendChild(row);
 });
}

async function adminKick(uid){

 if(!uid || !confirm("Kick this user?"))return;

 await db.ref("userRedirects/"+uid).set({
  url:"https://www.google.com",
  timestamp:Date.now(),
  reason:"kick"
 });

 await refreshAdminUsers();
}

async function adminBan(uid){

 if(!uid || !confirm("Ban this user permanently?"))return;

 await db.ref("bans/"+uid).set({
  bannedAt:Date.now(),
  bannedBy:firebaseUid
 });

 await db.ref("userRedirects/"+uid).set({
  url:"https://www.google.com",
  timestamp:Date.now(),
  reason:"ban"
 });

 await refreshAdminUsers();
}

async function generateOneTimeCode(){

 if(!firebaseIsAdmin)return;

 let code="";

 do{
  code=Math.random().toString(36).slice(2,10).toUpperCase();
 }while((await db.ref("accessCodes/"+code).once("value")).exists());

 await db.ref("accessCodes/"+code).set({
  used:false,
  createdAt:Date.now(),
  createdBy:firebaseUid
 });

 $("adminCodeResult").textContent=code;
 $("adminCodeResult").style.display="block";
}

async function showBannedUsers(){

 if(!firebaseIsAdmin)return;

 const snap=await db.ref("bans").once("value");
 const bans=snap.val()||{};
 const list=$("adminUsers");

 list.innerHTML="";

 const ids=Object.keys(bans);

 if(!ids.length){
  list.innerHTML='<div style="color:#777;font-size:12px">No banned users.</div>';
  return;
 }

 for(const uid of ids){

  const userSnap=await db.ref("users/"+uid).once("value");
  const u=userSnap.val()||{};

  const row=document.createElement("div");
  row.className="adminUser";

  row.innerHTML=`
   <div class="adminUserInfo">
    <div class="adminUserCode">${escapeHtml(u.code||uid)}</div>
    <div class="adminUserMeta">Banned ${u.lastSeen?new Date(u.lastSeen).toLocaleString():""}</div>
   </div>
   <div class="adminUserBtns">
    <button class="unban">Unban</button>
   </div>
  `;

  row.querySelector(".unban").onclick=async()=>{
   await db.ref("bans/"+uid).remove();
   showBannedUsers();
  };

  list.appendChild(row);
 }
}

/* DRAWING */

const dc=$("drawCanvas");
const ctx=dc.getContext("2d");


function resizeDraw(){

 let r=dc.getBoundingClientRect();

 if(!r.width)return;

 let width=r.width;
 let height=width*.5833;
 let dpr=Math.max(1,window.devicePixelRatio||1);

 dc.width=Math.round(width*dpr);
 dc.height=Math.round(height*dpr);

 ctx.setTransform(dpr,0,0,dpr,0,0);

 drawStudio();
}


function pos(e){

 let r=dc.getBoundingClientRect();

 return{
  x:(e.clientX-r.left)*
   (dc.clientWidth/r.width),

  y:(e.clientY-r.top)*
   (dc.clientHeight/r.height)
 };
}


dc.addEventListener("pointerdown",e=>{

 e.preventDefault();
 drawing=true;

 try{dc.setPointerCapture(e.pointerId)}catch{}

 activeStroke=[pos(e)];
 strokes.push(activeStroke);

 drawStudio();
});


dc.addEventListener("pointermove",e=>{

 if(!drawing)return;

 e.preventDefault();

 activeStroke.push(pos(e));

 drawStudio();
});


function endDraw(e){

 drawing=false;
 activeStroke=null;

 try{dc.releasePointerCapture(e.pointerId)}catch{}
}

dc.addEventListener("pointerup",endDraw);
dc.addEventListener("pointercancel",endDraw);


/* DRAW */

function line(points,color,width){

 if(!points.length)return;

 ctx.beginPath();

 ctx.lineCap="round";
 ctx.lineJoin="round";

 ctx.strokeStyle=color;
 ctx.lineWidth=width;

 ctx.moveTo(points[0].x,points[0].y);

 for(let i=1;i<points.length;i++)
  ctx.lineTo(points[i].x,points[i].y);

 if(points.length===1)
  ctx.lineTo(
   points[0].x+.1,
   points[0].y+.1
  );

 ctx.stroke();
}


function guideChar(){

 let ch=chars[charIndex];
 let w=dc.clientWidth;
 let h=dc.clientHeight;

 ctx.save();

 ctx.font=`${Math.min(w,h)*.42}px Arial`;
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillStyle="rgba(120,120,120,.22)";

 ctx.fillText(ch,w/2,h*.51);

 ctx.restore();
}


function drawStudio(){

 let w=dc.clientWidth;
 let h=dc.clientHeight;

 if(!w)return;

 ctx.clearRect(0,0,w,h);

 ctx.fillStyle="#fff";
 ctx.fillRect(0,0,w,h);

 ctx.lineWidth=2;
 ctx.strokeStyle="rgba(220,40,40,.35)";

 [.22,.42,.62,.82].forEach(y=>{

  ctx.beginPath();
  ctx.moveTo(0,h*y);
  ctx.lineTo(w,h*y);
  ctx.stroke();
 });

 guideChar();

 for(const s of strokes)
  line(s,"#111",Math.max(3,w/170));
}


/* CHARACTER DATA */

function ensureCharacter(ch){

 let g=fonts[currentFont].glyphs[ch];

 if(!g){

  g={
   variations:[{strokes:[]}]
  };

  fonts[currentFont].glyphs[ch]=g;

 }else if(!Array.isArray(g.variations)){

  g={
   variations:[
    {strokes:g.strokes||[]}
   ]
  };

  fonts[currentFont].glyphs[ch]=g;
 }

 if(!g.variations.length)
  g.variations.push({strokes:[]});

 return g;
}


/* COUNTER */

function updateCounter(){

 let ch=chars[charIndex];
 let g=ensureCharacter(ch);

 let total=g.variations.length;

 $("counter").textContent=
  `${charIndex+1}/${chars.length} • "${ch}" • Variation ${variationIndex+1}/${total}`;

 $("variationBack").disabled=
  variationIndex===0;

 $("variationNext").disabled=
  variationIndex>=total-1;

 $("deleteVariation").disabled=
  total<=1;

 $("charBack").disabled=
  charIndex===0;

 $("charNext").disabled=
  charIndex===chars.length-1;
}


/* SAVE */

function saveGlyph(){

 let ch=chars[charIndex];
 let g=ensureCharacter(ch);

 g.variations[variationIndex]={
  strokes:JSON.parse(
   JSON.stringify(strokes)
  )
 };

 saveFonts();
 updateCounter();
 render();
}


/* LOAD */

function loadGlyph(){

 let ch=chars[charIndex];
 let g=ensureCharacter(ch);

 if(variationIndex>=g.variations.length)
  variationIndex=g.variations.length-1;

 let v=g.variations[variationIndex];

 strokes=v?.strokes
  ?JSON.parse(JSON.stringify(v.strokes))
  :[];

 updateCounter();
 drawStudio();
}

   )
  )

};

/* GENERATOR */

const gc=$("genCanvas");
const gx=gc.getContext("2d");


function resizeGenerate(){

 let r=gc.getBoundingClientRect();

 if(!r.width||!r.height)return;

 let dpr=2;

 gc.width=Math.round(r.width*dpr);
 gc.height=Math.round(r.height*dpr);

 gx.setTransform(dpr,0,0,dpr,0,0);
}


function drawGlyph(g,x,y,size,color){

 if(!g?.strokes?.length)return 0;

 let sx=size/100;

 let minX=Infinity;
 let minY=Infinity;
 let maxX=-Infinity;
 let maxY=-Infinity;

 g.strokes.forEach(s=>
  s.forEach(p=>{

   minX=Math.min(minX,p.x);
   minY=Math.min(minY,p.y);
   maxX=Math.max(maxX,p.x);
   maxY=Math.max(maxY,p.y);

  })
 );

 if(!isFinite(minX))return 0;

 gx.save();

 gx.translate(
  x-minX*sx,
  y-minY*sx
 );

 gx.scale(sx,sx);

 g.strokes.forEach(s=>{

  gx.beginPath();

  gx.strokeStyle=color;
  gx.lineWidth=
   Math.max(2,(g.width||1200)/170);

  gx.lineCap="round";
  gx.lineJoin="round";

  s.forEach((p,i)=>{

   if(i)gx.lineTo(p.x,p.y);
   else gx.moveTo(p.x,p.y);

  });

  gx.stroke();
 });

 gx.restore();

 return(maxX-minX)*sx;
}


/* RANDOM VARIATION */

function randomGlyph(ch){

 let g=fonts[currentFont].glyphs[ch];

 if(!g)return null;

 if(Array.isArray(g.variations)){

  let usable=
   g.variations.filter(
    v=>v?.strokes?.length
   );

  if(usable.length){

   return usable[
    Math.floor(
     Math.random()*usable.length
    )
   ];
  }
 }

 if(g.strokes?.length)
  return g;

 return null;
}


/* RENDER */

function render(){

 let w=gc.clientWidth;
 let h=gc.clientHeight;

 if(!w||!h)return;

 gx.clearRect(0,0,w,h);

 gx.fillStyle=$("paperColor").value;
 gx.fillRect(0,0,w,h);

 let size=+$("fontSize").value||32;
 let letter=+$("letterSpace").value||0;
 let lineGap=+$("lineSpace").value||0;

 let text=$("text").value;
 let color=$("textColor").value;

 let left=35;
 let top=45;
 let maxW=w-70;
 let lineHeight=size+lineGap;
 let y=top;

 for(let row of text.split("\n")){

  let x=left;

  for(let ch of row){

   let g=randomGlyph(ch);

   if(g){

    let advance=
     drawGlyph(
      g,x,y,size,color
     );

    x+=advance+letter;

   }else{

    gx.save();

    gx.font=`${size}px Arial`;
    gx.fillStyle=color;
    gx.textBaseline="top";

    gx.fillText(ch,x,y);

    x+=
     gx.measureText(ch).width
     +letter;

    gx.restore();
   }

   if(x>maxW){

    x=left;
    y+=lineHeight;
   }
  }

  y+=lineHeight;
 }
}
