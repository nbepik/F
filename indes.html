<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handwriting Studio</title>

<style>
:root{
    --accent:#a855f7;
    --accent2:#c084fc;
    --bg:#07040d;
    --panel:#11091b;
    --panel2:#190d27;
    --border:rgba(168,85,247,.45);
    --text:#ffffff;
    --muted:#c9a6e8;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% -10%,#301050 0%,#100719 38%,#07040d 75%);
}

/* =========================================================
   PASSWORD
========================================================= */

#auth{
    position:fixed;
    inset:0;
    z-index:99999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#07040d;
}

#passwordInput{
    width:min(340px,85vw);
    height:54px;
    padding:0 20px;
    border:1px solid var(--border);
    border-radius:14px;
    outline:none;
    background:#0b0710;
    color:white;
    font-size:17px;
    text-align:center;
    box-shadow:0 0 30px rgba(168,85,247,.12);
}

#passwordInput:focus{
    border-color:var(--accent);
    box-shadow:0 0 30px rgba(168,85,247,.28);
}

/* =========================================================
   APP
========================================================= */

#app{
    display:none;
    width:100%;
    height:100%;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    height:68px;
    position:relative;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid var(--border);
    background:rgba(9,5,14,.84);
    backdrop-filter:blur(18px);
}

.tabs{
    display:flex;
    gap:5px;
    padding:5px;
    border:1px solid var(--border);
    border-radius:13px;
    background:rgba(0,0,0,.28);
}

.tab{
    min-width:125px;
    padding:10px 25px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:var(--muted);
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.tab:hover{
    color:white;
}

.tab.active{
    color:white;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 20px rgba(168,85,247,.3);
}

/* =========================================================
   SETTINGS BUTTON
========================================================= */

.settings-button{
    position:absolute;
    left:18px;
    top:15px;
    width:38px;
    height:38px;
    border:1px solid var(--border);
    border-radius:10px;
    background:rgba(20,10,30,.85);
    color:white;
    font-size:18px;
    cursor:pointer;
}

/* =========================================================
   SETTINGS
========================================================= */

.settings-panel{
    position:fixed;
    z-index:5000;
    top:0;
    left:-310px;
    width:290px;
    height:100%;
    padding:24px;
    background:rgba(12,6,20,.98);
    border-right:1px solid var(--border);
    box-shadow:15px 0 45px rgba(0,0,0,.45);
    transition:left .28s ease;
}

.settings-panel.open{
    left:0;
}

.settings-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:30px;
}

.settings-header h2{
    font-size:21px;
}

.close-settings{
    width:36px;
    height:36px;
    border:1px solid var(--border);
    border-radius:9px;
    background:rgba(0,0,0,.3);
    color:white;
    font-size:22px;
    cursor:pointer;
}

.setting label{
    display:block;
    margin-bottom:9px;
    color:var(--muted);
    font-size:13px;
}

#accentColor{
    width:100%;
    height:45px;
    padding:3px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#08050d;
    cursor:pointer;
}

/* =========================================================
   GENERATE
========================================================= */

#generate{
    display:flex;
    width:100%;
    height:calc(100% - 68px);
}

.generate-sidebar{
    width:285px;
    min-width:285px;
    height:100%;
    padding:22px;
    overflow-y:auto;
    background:rgba(11,6,18,.82);
    border-right:1px solid var(--border);
}

.generate-sidebar h2{
    margin-bottom:20px;
    font-size:21px;
}

.control{
    margin-bottom:20px;
}

.control-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
    color:var(--muted);
    font-size:13px;
}

.control select,
.control textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#08050d;
    color:white;
}

.control select{
    height:42px;
    padding:0 10px;
}

.control textarea{
    min-height:125px;
    resize:vertical;
    padding:11px;
    font-family:inherit;
}

.range{
    width:100%;
    accent-color:var(--accent);
}

.small-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.small-button{
    padding:9px 7px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#10091a;
    color:white;
    cursor:pointer;
}

.small-button:hover{
    background:#1c0e2b;
}

.danger-button{
    width:100%;
    margin-top:7px;
    padding:9px;
    border:1px solid rgba(239,68,68,.6);
    border-radius:8px;
    background:transparent;
    color:#ff8585;
    cursor:pointer;
}

.color-picker{
    width:100%;
    height:40px;
    padding:3px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#08050d;
    cursor:pointer;
}

.export-title{
    margin-top:25px;
    margin-bottom:9px;
    color:var(--muted);
    font-size:13px;
}

.export-buttons{
    display:grid;
    gap:8px;
}

.export-button{
    padding:11px;
    border:0;
    border-radius:9px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.export-button:hover{
    filter:brightness(1.08);
}

/* =========================================================
   PAPER
========================================================= */

.paper-area{
    flex:1;
    min-width:0;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:35px;
    overflow:auto;
}

.paper{
    position:relative;
    width:min(720px,72vw);
    height:min(850px,84vh);
    min-width:450px;
    min-height:560px;
    overflow:hidden;
    background:#fff;
    color:#111;
    box-shadow:0 20px 65px rgba(0,0,0,.55);
}

#generateCanvas{
    display:block;
    width:100%;
    height:100%;
}

/* =========================================================
   STUDIO
========================================================= */

#studio{
    display:none;
    width:100%;
    height:calc(100% - 68px);
    overflow:auto;
    align-items:center;
    justify-content:center;
}

.studio-container{
    width:min(760px,94vw);
    padding:25px 10px 35px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:17px;
}

.studio-top{
    width:min(620px,90vw);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.font-selector{
    flex:1;
}

.font-selector select{
    width:100%;
    height:42px;
    padding:0 10px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#0c0711;
    color:white;
}

.new-font-button{
    height:42px;
    padding:0 16px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--panel);
    color:white;
    cursor:pointer;
}

.current-character{
    text-align:center;
}

.character-preview{
    height:65px;
    font-size:54px;
    font-weight:bold;
    text-shadow:0 0 20px rgba(168,85,247,.5);
}

.character-counter{
    color:var(--muted);
    font-size:13px;
}

.canvas-frame{
    width:min(620px,90vw);
    aspect-ratio:1 / 1;
    padding:0;
    overflow:hidden;
    border-radius:15px;
    background:white;
    box-shadow:
        0 0 0 1px rgba(168,85,247,.25),
        0 0 45px rgba(168,85,247,.22);
}

#studioCanvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
    cursor:crosshair;
}

.studio-actions{
    width:min(620px,90vw);
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:9px;
}

.studio-actions button{
    height:44px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--panel);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.studio-actions button:hover{
    background:var(--panel2);
}

.studio-actions button:disabled{
    opacity:.3;
    cursor:not-allowed;
}

.studio-actions .next{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:0;
}

.font-name-row{
    width:min(620px,90vw);
    display:flex;
    gap:9px;
}

.font-name-row input{
    flex:1;
    height:42px;
    padding:0 12px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#0c0711;
    color:white;
}

.font-name-row button{
    height:42px;
    padding:0 18px;
    border:0;
    border-radius:9px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.studio-hint{
    width:min(620px,90vw);
    text-align:center;
    color:rgba(255,255,255,.5);
    font-size:12px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    .generate-sidebar{
        width:235px;
        min-width:235px;
        padding:15px;
    }

    .paper{
        min-width:350px;
        min-height:500px;
        width:68vw;
        height:80vh;
    }

    .paper-area{
        padding:15px;
    }

}

@media(max-width:600px){

    .topbar{
        height:60px;
    }

    .settings-button{
        left:10px;
        top:11px;
    }

    .tab{
        min-width:105px;
        padding:9px 15px;
    }

    #generate,
    #studio{
        height:calc(100% - 60px);
    }

    .generate-sidebar{
        width:200px;
        min-width:200px;
    }

    .paper{
        min-width:300px;
    }

    .studio-container{
        padding-top:15px;
    }

    .studio-actions{
        grid-template-columns:1fr 1fr;
    }

    .studio-actions .next{
        grid-column:span 2;
    }

}
</style>
</head>

<body>

<!-- =========================================================
     PASSWORD
========================================================= -->

<div id="auth">

    <input
        id="passwordInput"
        type="password"
        placeholder="Enter password"
        autocomplete="off"
    >

</div>


<!-- =========================================================
     APP
========================================================= -->

<div id="app">

    <!-- TOP -->

    <div class="topbar">

        <button
            class="settings-button"
            id="settingsButton"
        >⚙</button>

        <div class="tabs">

            <button
                class="tab active"
                id="generateTab"
            >
                Generate
            </button>

            <button
                class="tab"
                id="studioTab"
            >
                Studio
            </button>

        </div>

    </div>


    <!-- =====================================================
         SETTINGS
    ====================================================== -->

    <div
        class="settings-panel"
        id="settingsPanel"
    >

        <div class="settings-header">

            <h2>Settings</h2>

            <button
                class="close-settings"
                id="closeSettings"
            >×</button>

        </div>

        <div class="setting">

            <label>Interface color</label>

            <input
                type="color"
                id="accentColor"
                value="#a855f7"
            >

        </div>

    </div>


    <!-- =====================================================
         GENERATE
    ====================================================== -->

    <section id="generate">

        <aside class="generate-sidebar">

            <h2>Generate</h2>


            <!-- FONT -->

            <div class="control">

                <div class="control-title">
                    <span>Font</span>
                </div>

                <select id="fontSelect"></select>

                <div class="small-buttons">

                    <button
                        class="small-button"
                        id="renameFont"
                    >
                        Rename
                    </button>

                    <button
                        class="small-button"
                        id="newFontGenerate"
                    >
                        New
                    </button>

                </div>

                <button
                    class="danger-button"
                    id="deleteFont"
                >
                    Delete font
                </button>

            </div>


            <!-- TEXT -->

            <div class="control">

                <div class="control-title">

                    <span>Text</span>

                    <span id="textLength">0</span>

                </div>

                <textarea
                    id="textInput"
                    placeholder="Write something..."
                ></textarea>

            </div>


            <!-- SIZE -->

            <div class="control">

                <div class="control-title">

                    <span>Font size</span>

                    <span id="sizeValue">42</span>

                </div>

                <input
                    class="range"
                    id="fontSize"
                    type="range"
                    min="12"
                    max="120"
                    value="42"
                >

            </div>


            <!-- SPACING -->

            <div class="control">

                <div class="control-title">

                    <span>Letter spacing</span>

                    <span id="spacingValue">0</span>

                </div>

                <input
                    class="range"
                    id="letterSpacing"
                    type="range"
                    min="-10"
                    max="40"
                    value="0"
                >

            </div>


            <!-- TEXT COLOR -->

            <div class="control">

                <div class="control-title">
                    <span>Text color</span>
                </div>

                <input
                    class="color-picker"
                    id="textColor"
                    type="color"
                    value="#111111"
                >

            </div>


            <!-- BACKGROUND -->

            <div class="control">

                <div class="control-title">
                    <span>Paper background</span>
                </div>

                <div class="small-buttons">

                    <button
                        class="small-button bgPreset"
                        data-color="#ffffff"
                    >
                        White
                    </button>

                    <button
                        class="small-button bgPreset"
                        data-color="#f5f1e8"
                    >
                        Cream
                    </button>

                    <button
                        class="small-button bgPreset"
                        data-color="#e9eef5"
                    >
                        Blue
                    </button>

                    <button
                        class="small-button bgPreset"
                        data-color="#111111"
                    >
                        Black
                    </button>

                </div>

            </div>


            <div class="control">

                <div class="control-title">
                    <span>Custom background</span>
                </div>

                <input
                    class="color-picker"
                    id="paperColor"
                    type="color"
                    value="#ffffff"
                >

            </div>


            <!-- EXPORT -->

            <div class="export-title">
                Export
            </div>

            <div class="export-buttons">

                <button
                    class="export-button"
                    id="pngButton"
                >
                    Save as PNG
                </button>

                <button
                    class="export-button"
                    id="pdfButton"
                >
                    Save as PDF
                </button>

                <button
                    class="export-button"
                    id="goodNotesButton"
                >
                    Save for GoodNotes
                </button>

            </div>

        </aside>


        <main class="paper-area">

            <div class="paper">

                <canvas
                    id="generateCanvas"
                ></canvas>

            </div>

        </main>

    </section>


    <!-- =====================================================
         STUDIO
    ====================================================== -->

    <section id="studio">

        <div class="studio-container">


            <!-- FONT SELECT -->

            <div class="studio-top">

                <div class="font-selector">

                    <select id="studioFontSelect"></select>

                </div>

                <button
                    class="new-font-button"
                    id="newFontStudio"
                >
                    New font
                </button>

            </div>


            <!-- CHARACTER -->

            <div class="current-character">

                <div
                    class="character-preview"
                    id="currentCharacter"
                >
                    A
                </div>

                <div
                    class="character-counter"
                    id="characterCounter"
                >
                    Character 1
                </div>

            </div>


            <!-- DRAWING -->

            <div class="canvas-frame">

                <canvas
                    id="studioCanvas"
                ></canvas>

            </div>


            <!-- NAME -->

            <div class="font-name-row">

                <input
                    id="fontNameInput"
                    value="My Font"
                    placeholder="Font name"
                >

                <button id="saveFontButton">
                    Save font
                </button>

            </div>


            <!-- NAVIGATION -->

            <div class="studio-actions">

                <button id="backButton">
                    ← Back
                </button>

                <button id="clearButton">
                    Clear
                </button>

                <button
                    class="next"
                    id="nextButton"
                >
                    Next →
                </button>

            </div>


            <div class="studio-hint">
                Write over the gray character. The red lines are only guides.
            </div>

        </div>

    </section>

</div>


<script>

/* =========================================================
   PASSWORD
========================================================= */

const PASSWORD = "0000";

const auth =
    document.getElementById("auth");

const passwordInput =
    document.getElementById("passwordInput");

const app =
    document.getElementById("app");


passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key !== "Enter")
            return;

        if(passwordInput.value === PASSWORD){

            auth.style.display = "none";
            app.style.display = "block";

            setTimeout(function(){
                resizeStudioCanvas();
                drawStudio();
                renderGenerate();
            },50);

        }else{

            passwordInput.value = "";

            passwordInput.animate(
                [
                    {transform:"translateX(0)"},
                    {transform:"translateX(-8px)"},
                    {transform:"translateX(8px)"},
                    {transform:"translateX(-5px)"},
                    {transform:"translateX(0)"}
                ],
                {
                    duration:260
                }
            );

        }

    }
);


/* =========================================================
   SETTINGS
========================================================= */

const settingsPanel =
    document.getElementById("settingsPanel");

document
    .getElementById("settingsButton")
    .addEventListener("click",function(){

        settingsPanel.classList.add("open");

    });


document
    .getElementById("closeSettings")
    .addEventListener("click",function(){

        settingsPanel.classList.remove("open");

    });


const accentColor =
    document.getElementById("accentColor");

const savedAccent =
    localStorage.getItem(
        "handwriting_accent"
    );

if(savedAccent){

    accentColor.value = savedAccent;

    document.documentElement.style
        .setProperty("--accent",savedAccent);

    document.documentElement.style
        .setProperty("--accent2",savedAccent);

}


accentColor.addEventListener(
    "input",
    function(){

        const color =
            accentColor.value;

        document.documentElement.style
            .setProperty("--accent",color);

        document.documentElement.style
            .setProperty("--accent2",color);

        localStorage.setItem(
            "handwriting_accent",
            color
        );

    }
);


/* =========================================================
   TABS
========================================================= */

const generate =
    document.getElementById("generate");

const studio =
    document.getElementById("studio");

const generateTab =
    document.getElementById("generateTab");

const studioTab =
    document.getElementById("studioTab");


generateTab.addEventListener(
    "click",
    function(){

        generate.style.display = "flex";
        studio.style.display = "none";

        generateTab.classList.add("active");
        studioTab.classList.remove("active");

        renderGenerate();

    }
);


studioTab.addEventListener(
    "click",
    function(){

        generate.style.display = "none";
        studio.style.display = "flex";

        studioTab.classList.add("active");
        generateTab.classList.remove("active");

        setTimeout(function(){

            resizeStudioCanvas();
            drawStudio();

        },30);

    }
);


/* =========================================================
   FONT DATABASE
========================================================= */

let fonts;

try{

    fonts =
        JSON.parse(
            localStorage.getItem(
                "handwriting_fonts"
            ) || "{}"
        );

}catch{

    fonts = {};

}


function saveFonts(){

    localStorage.setItem(
        "handwriting_fonts",
        JSON.stringify(fonts)
    );

}


/* =========================================================
   CREATE DEFAULT FONT
========================================================= */

if(
    !fonts["My Font"]
){

    fonts["My Font"] = {
        name:"My Font",
        glyphs:{}
    };

    saveFonts();

}


/* =========================================================
   ENGLISH + GERMAN CHARACTER SET
========================================================= */

const characters = [
    ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    ..."abcdefghijklmnopqrstuvwxyz",

    /* German */
    ..."ÄÖÜ",
    ..."äöü",
    ..."ß",

    /* Numbers */
    ..."0123456789",

    /* English / German punctuation */
    ...".,!?;:'\"-–—_",
    ..."()[]{}",
    ..."/\\",
    ..."@#$%&*+=<>",
    ..."€£¥",
    ..."©®™",
    ..."°§",
    ..."…",
    ..."«»",
    ..."„“”",
    ..."’"
];


/* =========================================================
   FONT SELECTS
========================================================= */

const fontSelect =
    document.getElementById("fontSelect");

const studioFontSelect =
    document.getElementById("studioFontSelect");


let currentFontName = "My Font";


function refreshFontLists(){

    const currentGenerate =
        fontSelect.value;

    const currentStudio =
        studioFontSelect.value;

    fontSelect.innerHTML = "";
    studioFontSelect.innerHTML = "";


    Object.keys(fonts).forEach(function(name){

        const option1 =
            document.createElement("option");

        option1.value = name;
        option1.textContent = name;

        fontSelect.appendChild(option1);


        const option2 =
            document.createElement("option");

        option2.value = name;
        option2.textContent = name;

        studioFontSelect.appendChild(option2);

    });


    if(fonts[currentGenerate]){

        fontSelect.value =
            currentGenerate;

    }else{

        fontSelect.value =
            Object.keys(fonts)[0];

    }


    if(fonts[currentStudio]){

        studioFontSelect.value =
            currentStudio;

    }else{

        studioFontSelect.value =
            Object.keys(fonts)[0];

    }


    currentFontName =
        studioFontSelect.value;

}


refreshFontLists();


/* =========================================================
   GENERATE CANVAS
========================================================= */

const generateCanvas =
    document.getElementById("generateCanvas");

const generateCtx =
    generateCanvas.getContext("2d");


const textInput =
    document.getElementById("textInput");

const fontSizeInput =
    document.getElementById("fontSize");

const letterSpacingInput =
    document.getElementById("letterSpacing");

const textColorInput =
    document.getElementById("textColor");

const paperColorInput =
    document.getElementById("paperColor");


function resizeGenerateCanvas(){

    const rect =
        generateCanvas.parentElement
            .getBoundingClientRect();

    const ratio =
        window.devicePixelRatio || 1;

    generateCanvas.width =
        rect.width * ratio;

    generateCanvas.height =
        rect.height * ratio;

    generateCanvas.style.width =
        rect.width + "px";

    generateCanvas.style.height =
        rect.height + "px";

    generateCtx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

    renderGenerate();

}


function drawGlyph(
    ctx,
    glyph,
    x,
    y,
    size,
    color
){

    if(!glyph)
        return;

    const box =
        glyph.box || {
            x:0,
            y:0,
            w:1,
            h:1
        };


    const scaleX =
        size / 100;

    const scaleY =
        size / 100;


    ctx.save();

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        Math.max(
            1,
            (glyph.penSize || 5) *
            scaleX
        );

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    glyph.strokes.forEach(
        function(stroke){

            if(stroke.length === 0)
                return;

            ctx.beginPath();

            for(
                let i = 0;
                i < stroke.length;
                i++
            ){

                const p =
                    stroke[i];

                const px =
                    x +
                    (p.x - box.x) *
                    scaleX;

                const py =
                    y +
                    (p.y - box.y) *
                    scaleY;

                if(i === 0){

                    ctx.moveTo(
                        px,
                        py
                    );

                }else{

                    ctx.lineTo(
                        px,
                        py
                    );

                }

            }

            ctx.stroke();

        }
    );

    ctx.restore();

}


/* =========================================================
   GENERATE TEXT
========================================================= */

function renderGenerate(){

    if(!generateCanvas.width)
        return;

    const rect =
        generateCanvas
            .getBoundingClientRect();

    const width =
        rect.width;

    const height =
        rect.height;


    const bg =
        paperColorInput.value;

    generateCtx.fillStyle =
        bg;

    generateCtx.fillRect(
        0,
        0,
        width,
        height
    );


    const text =
        textInput.value;


    document.getElementById("textLength")
        .textContent =
        text.length;


    const size =
        Number(fontSizeInput.value);

    const spacing =
        Number(letterSpacingInput.value);


    document.getElementById("sizeValue")
        .textContent =
        size;

    document.getElementById("spacingValue")
        .textContent =
        spacing;


    const font =
        fonts[fontSelect.value];


    if(!font)
        return;


    const padding =
        Math.max(
            30,
            size
        );


    let x =
        padding;

    let y =
        padding;

    const lineHeight =
        size * 1.35;


    for(
        let i = 0;
        i < text.length;
        i++
    ){

        const char =
            text[i];


        if(char === "\n"){

            x = padding;
            y += lineHeight;

            continue;

        }


        let glyph =
            font.glyphs[char];


        /*
          Missing characters use a normal
          system-font fallback.
        */

        if(!glyph){

            generateCtx.fillStyle =
                textColorInput.value;

            generateCtx.font =
                `${size}px Arial`;

            generateCtx.textBaseline =
                "top";

            const fallbackWidth =
                generateCtx.measureText(char)
                    .width;

            if(
                x + fallbackWidth >
                width - padding
            ){

                x = padding;
                y += lineHeight;

            }

            generateCtx.fillText(
                char,
                x,
                y
            );

            x +=
                fallbackWidth +
                spacing;

            continue;

        }


        const glyphWidth =
            size *
            (glyph.advance || 1);


        if(
            x + glyphWidth >
            width - padding
        ){

            x = padding;
            y += lineHeight;

        }


        drawGlyph(
            generateCtx,
            glyph,
            x,
            y,
            size,
            textColorInput.value
        );


        x +=
            glyphWidth +
            spacing;


        if(
            y + lineHeight >
            height
        ){

            break;

        }

    }

}

   GENERATE CONTROLS
========================================================= */

/* =========================================================
   STUDIO CANVAS
========================================================= */

const studioCanvas =
    document.getElementById("studioCanvas");

const studioCtx =
    studioCanvas.getContext("2d");


let studioWidth = 600;
let studioHeight = 600;

let strokes = [];
let currentStroke = null;
let drawing = false;


/* =========================================================
   STUDIO RESIZE
========================================================= */

function resizeStudioCanvas(){

    const rect =
        studioCanvas.getBoundingClientRect();

    if(
        rect.width <= 0 ||
        rect.height <= 0
    )
        return;


    const ratio =
        window.devicePixelRatio || 1;

    studioWidth =
        rect.width;

    studioHeight =
        rect.height;


    studioCanvas.width =
        rect.width * ratio;

    studioCanvas.height =
        rect.height * ratio;


    studioCtx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

}


/* =========================================================
   STUDIO GUIDE
========================================================= */

function drawNotebookLines(){

    /*
      White page
    */

    studioCtx.fillStyle =
        "#ffffff";

    studioCtx.fillRect(
        0,
        0,
        studioWidth,
        studioHeight
    );


    /*
      Four red translucent lines.

      These create:
      - top guide
      - upper writing line
      - lower writing line
      - bottom guide
    */

    studioCtx.save();

    studioCtx.strokeStyle =
        "rgba(220,45,55,.38)";

    studioCtx.lineWidth = 1.5;


    const lines = [
        studioHeight * 0.22,
        studioHeight * 0.42,
        studioHeight * 0.62,
        studioHeight * 0.82
    ];


    lines.forEach(
        function(y){

            studioCtx.beginPath();

            studioCtx.moveTo(
                0,
                y
            );

            studioCtx.lineTo(
                studioWidth,
                y
            );

            studioCtx.stroke();

        }
    );

    studioCtx.restore();

}


/* =========================================================
   GRAY CHARACTER GUIDE
========================================================= */

function drawCharacterGuide(){

    const char =
        characters[studioIndex];


    /*
      Space doesn't need a visible guide.
    */

    if(char === " ")
        return;


    studioCtx.save();

    studioCtx.fillStyle =
        "rgba(75,75,75,.20)";

    studioCtx.font =
        `500 ${studioHeight * .58}px Arial`;

    studioCtx.textAlign =
        "center";

    studioCtx.textBaseline =
        "middle";


    studioCtx.fillText(
        char,
        studioWidth / 2,
        studioHeight * .52
    );


    studioCtx.restore();

}


/* =========================================================
   USER DRAWING
========================================================= */

function drawUserStrokes(){

    studioCtx.save();

    /*
      Always BLACK.
    */

    studioCtx.strokeStyle =
        "#000000";

    studioCtx.fillStyle =
        "#000000";

    studioCtx.lineWidth = 5;

    studioCtx.lineCap =
        "round";

    studioCtx.lineJoin =
        "round";


    strokes.forEach(
        function(stroke){

            if(stroke.length === 0)
                return;


            /*
              A single point gets a small dot.
            */

            if(stroke.length === 1){

                studioCtx.beginPath();

                studioCtx.arc(
                    stroke[0].x,
                    stroke[0].y,
                    2.5,
                    0,
                    Math.PI * 2
                );

                studioCtx.fill();

                return;

            }


            studioCtx.beginPath();

            studioCtx.moveTo(
                stroke[0].x,
                stroke[0].y
            );


            for(
                let i = 1;
                i < stroke.length;
                i++
            ){

                studioCtx.lineTo(
                    stroke[i].x,
                    stroke[i].y
                );

            }


            studioCtx.stroke();

        }
    );


    studioCtx.restore();

}


/* =========================================================
   DRAW EVERYTHING
========================================================= */

function drawStudio(){

    if(
        studioWidth <= 0 ||
        studioHeight <= 0
    )
        return;


    drawNotebookLines();

    drawCharacterGuide();

    drawUserStrokes();

}


/* =========================================================
   POINTER POSITION
========================================================= */

function getPointerPosition(event){

    const rect =
        studioCanvas.getBoundingClientRect();

    return {
        x:
            event.clientX -
            rect.left,

        y:
            event.clientY -
            rect.top
    };

}


/* =========================================================
   START DRAWING
========================================================= */

studioCanvas.addEventListener(
    "pointerdown",
    function(event){

        event.preventDefault();

        studioCanvas.setPointerCapture(
            event.pointerId
        );

        drawing = true;

        const p =
            getPointerPosition(event);

        currentStroke = [
            {
                x:p.x,
                y:p.y
            }
        ];

        strokes.push(
            currentStroke
        );

        drawStudio();

    }
);


/* =========================================================
   DRAW
========================================================= */

studioCanvas.addEventListener(
    "pointermove",
    function(event){

        if(!drawing)
            return;

        event.preventDefault();

        const p =
            getPointerPosition(event);

        currentStroke.push({
            x:p.x,
            y:p.y
        });

        drawStudio();

    }
);


/* =========================================================
   STOP
========================================================= */

function stopDrawing(){

    drawing = false;
    currentStroke = null;

}


studioCanvas.addEventListener(
    "pointerup",
    stopDrawing
);

studioCanvas.addEventListener(
    "pointercancel",
    stopDrawing
);


/* =========================================================
   SAVE CURRENT GLYPH
========================================================= */

function saveCurrentGlyph(){

    const font =
        fonts[currentFontName];

    if(!font)
        return;


    const char =
        characters[studioIndex];


    /*
      Find the drawing bounds.
    */

    let minX = Infinity;
    let minY = Infinity;
    let maxX = -Infinity;
    let maxY = -Infinity;


    strokes.forEach(
        function(stroke){

            stroke.forEach(
                function(point){

                    minX =
                        Math.min(
                            minX,
                            point.x
                        );

                    minY =
                        Math.min(
                            minY,
                            point.y
                        );

                    maxX =
                        Math.max(
                            maxX,
                            point.x
                        );

                    maxY =
                        Math.max(
                            maxY,
                            point.y
                        );

                }
            );

        }
    );


    /*
      If nothing was written,
      don't create a glyph.
    */

    if(
        strokes.length === 0 ||
        !isFinite(minX)
    ){

        delete font.glyphs[char];

        saveFonts();

        return;

    }


    /*
      A little padding around the glyph.
    */

    const padding = 8;


    minX -= padding;
    minY -= padding;
    maxX += padding;
    maxY += padding;


    const width =
        Math.max(
            20,
            maxX - minX
        );


    /*
      Advance determines how much space
      the character gets in Generate.
    */

    let advance =
        width / studioHeight;


    advance =
        Math.max(
            .45,
            Math.min(
                1.25,
                advance
            )
        );


    /*
      Store normalized-independent canvas
      coordinates. They will scale later.
    */

    font.glyphs[char] = {

        strokes:
            strokes.map(
                function(stroke){

                    return stroke.map(
                        function(point){

                            return {
                                x:point.x,
                                y:point.y
                            };

                        }
                    );

                }
            ),

        box:{
            x:minX,
            y:minY,
            w:width,
            h:
                Math.max(
                    20,
                    maxY - minY
                )
        },

        advance:advance,

        penSize:5

    };


    saveFonts();

}


/* =========================================================
   LOAD GLYPH
========================================================= */

function loadCurrentGlyph(){

    const font =
        fonts[currentFontName];


    const char =
        characters[studioIndex];


    if(
        font &&
        font.glyphs &&
        font.glyphs[char]
    ){

        const glyph =
            font.glyphs[char];


        strokes =
            glyph.strokes.map(
                function(stroke){

                    return stroke.map(
                        function(point){

                            return {
                                x:point.x,
                                y:point.y
                            };

                        }
                    );

                }
            );

    }else{

        strokes = [];

    }


    drawStudio();

}


/* =========================================================
   UPDATE STUDIO UI
========================================================= */

function updateStudio(){

    const char =
        characters[studioIndex];


    document
        .getElementById("currentCharacter")
        .textContent =
            char === " "
                ? "SPACE"
                : char;


    document
        .getElementById("characterCounter")
        .textContent =
            `Character ${studioIndex + 1} / ${characters.length}`;


    document
        .getElementById("backButton")
        .disabled =
            studioIndex === 0;


    document
        .getElementById("fontNameInput")
        .value =
            currentFontName;


    loadCurrentGlyph();

}


/* =========================================================
   NEXT
========================================================= */

document
    .getElementById("nextButton")
    .addEventListener(
        "click",
        function(){

            saveCurrentGlyph();

            if(
                studioIndex <
                characters.length - 1
            ){

                studioIndex++;

                updateStudio();

            }

        }
    );


/* =========================================================
   BACK
========================================================= */

document
    .getElementById("backButton")
    .addEventListener(
        "click",
        function(){

            if(studioIndex === 0)
                return;


            saveCurrentGlyph();

            studioIndex--;

            updateStudio();

        }
    );


/* =========================================================
   CLEAR
========================================================= */

document
    .getElementById("clearButton")
    .addEventListener(
        "click",
        function(){

            strokes = [];

            currentStroke = null;

            saveCurrentGlyph();

            drawStudio();

        }
    );


/* =========================================================
   STUDIO FONT CHANGE
========================================================= */

studioFontSelect.addEventListener(
    "change",
    function(){

        saveCurrentGlyph();

        currentFontName =
            studioFontSelect.value;

        updateStudio();

    }
);


/* =========================================================
   FONT NAME
========================================================= */

document
    .getElementById("saveFontButton")
    .addEventListener(
        "click",
        function(){

            const input =
                document
                    .getElementById("fontNameInput")
                    .value
                    .trim();


            if(!input)
                return;


            if(
                input !== currentFontName &&
                fonts[input]
            ){

                alert(
                    "A font with this name already exists."
                );

                return;

            }


            if(
                input !== currentFontName
            ){

                fonts[input] =
                    fonts[currentFontName];

                fonts[input].name =
                    input;

                delete fonts[currentFontName];

                currentFontName =
                    input;

            }


            saveCurrentGlyph();

            refreshFontLists();

            fontSelect.value =
                currentFontName;

            studioFontSelect.value =
                currentFontName;

            saveFonts();

            renderGenerate();

        }
    );


/* =========================================================
   NEW FONT
========================================================= */

function createNewFont(){

    const name =
        prompt(
            "Enter the new font name:"
        );


    if(!name)
        return;


    const clean =
        name.trim();


    if(!clean)
        return;


    if(fonts[clean]){

        alert(
            "A font with this name already exists."
        );

        return;

    }


    /*
      Save the current glyph first.
    */

    saveCurrentGlyph();


    fonts[clean] = {
        name:clean,
        glyphs:{}
    };


    saveFonts();


    currentFontName =
        clean;


    studioIndex = 0;


    refreshFontLists();


    fontSelect.value =
        clean;

    studioFontSelect.value =
        clean;


    updateStudio();

}


document
    .getElementById("newFontStudio")
    .addEventListener(
        "click",
        createNewFont
    );


document
    .getElementById("newFontGenerate")
    .addEventListener(
        "click",
        createNewFont
    );


/* =========================================================
   RENAME FONT
========================================================= */

document
    .getElementById("renameFont")
    .addEventListener(
        "click",
        function(){

            const oldName =
                fontSelect.value;


            const newName =
                prompt(
                    "New font name:",
                    oldName
                );


            if(!newName)
                return;


            const clean =
                newName.trim();


            if(
                !clean ||
                clean === oldName
            )
                return;


            if(fonts[clean]){

                alert(
                    "A font with this name already exists."
                );

                return;

            }


            fonts[clean] =
                fonts[oldName];

            fonts[clean].name =
                clean;

            delete fonts[oldName];


            if(
                currentFontName === oldName
            ){

                currentFontName =
                    clean;

            }


            saveFonts();

            refreshFontLists();

            fontSelect.value =
                clean;

            studioFontSelect.value =
                currentFontName;

            document
                .getElementById("fontNameInput")
                .value =
                    currentFontName;

            renderGenerate();

        }
    );


/* =========================================================
   DELETE FONT
========================================================= */

document
    .getElementById("deleteFont")
    .addEventListener(
        "click",
        function(){

            const name =
                fontSelect.value;


            if(
                Object.keys(fonts).length <= 1
            ){

                alert(
                    "You need at least one font."
                );

                return;

            }


            if(
                !confirm(
                    `Delete "${name}"?`
                )
            )
                return;


            delete fonts[name];


            if(
                currentFontName === name
            ){

                currentFontName =
                    Object.keys(fonts)[0];

            }


            saveFonts();

            refreshFontLists();

            fontSelect.value =
                currentFontName;

            studioFontSelect.value =
                currentFontName;

            updateStudio();

            renderGenerate();

        }
    );


/* =========================================================
   PNG EXPORT
========================================================= */

document
    .getElementById("pngButton")
    .addEventListener(
        "click",
        function(){

            renderGenerate();


            generateCanvas.toBlob(
                function(blob){

                    if(!blob)
                        return;


                    const url =
                        URL.createObjectURL(blob);


                    const link =
                        document.createElement("a");


                    link.href = url;

                    link.download =
                        "handwriting-sheet.png";


                    document.body.appendChild(link);

                    link.click();

                    link.remove();

                    URL.revokeObjectURL(url);

                },
                "image/png"
            );

        }
    );
